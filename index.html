                        }
                        startX = e.touches[0].clientX;
                    }
                }
            }, { passive: false });
            
            lightboxImgWrapper.addEventListener('touchend', (e) => {
                if (currentScale > 1) {
                    // 放大状态：结束平移
                    endPan();
                }
            });

            // 全屏切换
            function toggleFullscreen() {
                // 检测全屏 API 支持
                if (!document.fullscreenEnabled) {
                    showToast('❌ 浏览器不支持全屏功能');
                    return;
                }
                
                if (!document.fullscreenElement) {
                    lightbox.requestFullscreen().catch(err => {
                        showToast('全屏失败：' + err.message);
                    });
                } else {
                    document.exitFullscreen();
                }
            }

            // 复制当前图片到剪贴板
            async function copyImageToClipboard() {
                if (currentLightboxList.length === 0) return;
                const img = currentLightboxList[currentIndex];
                try {
                    const response = await fetch(await ensureImageObjectUrl(img));
                    const blob = await response.blob();
                    await navigator.clipboard.write([
                        new ClipboardItem({ [blob.type]: blob })
                    ]);
                    showToast('✅ 图片已复制到剪贴板');
                } catch (err) {
                    showToast('❌ 复制失败：' + err.message);
                }
            }

            // 检测复制功能支持，不支持则隐藏按钮
            if (!navigator.clipboard || !window.ClipboardItem) {
                lightboxCopy.style.display = 'none';
            }

            // 事件绑定
            lightboxClose.addEventListener('click', closeLightbox);
            lightboxPrev.addEventListener('click', (e)=>{e.stopPropagation(); navLightbox(-1);});
            lightboxNext.addEventListener('click', (e)=>{e.stopPropagation(); navLightbox(1);});
            lightbox.addEventListener('click', function(e){ if(e.target===lightbox) closeLightbox(); });
            
            lightboxZoomIn.addEventListener('click', (e)=>{e.stopPropagation(); zoomIn();});
            lightboxZoomOut.addEventListener('click', (e)=>{e.stopPropagation(); zoomOut();});
            lightboxReset.addEventListener('click', (e)=>{e.stopPropagation(); resetZoom();});
            lightboxFullscreen.addEventListener('click', (e)=>{e.stopPropagation(); toggleFullscreen();});
            lightboxCopy.addEventListener('click', (e)=>{e.stopPropagation(); copyImageToClipboard();});

            lightboxImgWrapper.addEventListener('wheel', (e) => {
                e.preventDefault();
                if (e.deltaY < 0) zoomIn();
                else zoomOut();
            }, { passive: false });
            
            // 添加平移事件监听（鼠标）
            lightboxImgWrapper.addEventListener('mousedown', startPan);
            document.addEventListener('mousemove', doPan);
            document.addEventListener('mouseup', endPan);
            
            // 设置初始光标样式
            lightboxImgWrapper.style.cursor = 'default';
            lightboxImgWrapper.style.transition = 'transform 0.1s ease-out';
            
            document.addEventListener('keydown', e=>{
                if(lightbox.style.display==='flex'){
                    if(e.key==='Escape') {
                        if (document.fullscreenElement) {
                            document.exitFullscreen();
                        } else {
                            closeLightbox();
                        }
                    }
                    if(e.key==='ArrowLeft') { e.preventDefault(); navLightbox(-1); }
                    if(e.key==='ArrowRight') { e.preventDefault(); navLightbox(1); }
                    if(e.key==='+' || e.key==='=') { e.preventDefault(); zoomIn(); }
                    if(e.key==='-') { e.preventDefault(); zoomOut(); }
                    if(e.key==='0') { e.preventDefault(); resetZoom(); }
                    if(e.key==='f' || e.key==='F') { e.preventDefault(); toggleFullscreen(); }
                }
            });

            // 全屏变化时更新按钮文字（可选）
            document.addEventListener('fullscreenchange', () => {
                if (document.fullscreenElement) {
                    lightboxFullscreen.textContent = '⛶ 退出全屏';
                } else {
                    lightboxFullscreen.textContent = '⛶ 全屏';
                }
            });

            // 排序与筛选
            sortSelect.addEventListener('change', () => {
                currentSort = sortSelect.value;
                updateDisplay();
                scheduleSaveUISettings();
            });

            applyFilterBtn.addEventListener('click', () => {
                updateDisplay();
            });

            clearFilterBtn.addEventListener('click', () => {
                filterDateStart.value = '';
                filterDateEnd.value = '';
                updateDisplay();
            });

            searchInput.addEventListener('input', () => {
                // 搜索防抖：300ms 延迟执行
                clearTimeout(searchDebounceTimer);
                searchDebounceTimer = setTimeout(() => {
                    scrollContainer.scrollTop = 0;
                    updateDisplay();
                }, CONFIG.SEARCH_DEBOUNCE);
            });

            function collectTreePaths(node, paths = new Set()) {
                if (!node) return paths;
                paths.add(node.path);
                Object.values(node.children).forEach(child => collectTreePaths(child, paths));
                return paths;
            }

            function refreshFolderTreeSilently() {
                const nextTree = buildFolderTree(allImages, currentRootFolder);
                const expanded = getExpandedFolderPaths();
                const oldPaths = collectTreePaths(folderTree);
                const nextPaths = collectTreePaths(nextTree);
                const sameStructure = !!folderTree && oldPaths.size === nextPaths.size &&
                    [...oldPaths].every(path => nextPaths.has(path));

                if (!sameStructure) {
                    folderTree = nextTree;
                    renderTree(expanded);
                    return;
                }

                function applyNodeMetadata(currentNode, nextNode) {
                    currentNode.totalImages = nextNode.totalImages;
                    currentNode._handle = nextNode._handle;
                    if (currentNode._countEl) currentNode._countEl.textContent = nextNode.totalImages;
                    Object.keys(currentNode.children).forEach(name => {
                        applyNodeMetadata(currentNode.children[name], nextNode.children[name]);
                    });
                }
                applyNodeMetadata(folderTree, nextTree);
            }

            function pathsOverlap(pathA, pathB) {
                const a = normalizePath(pathA || '');
                const b = normalizePath(pathB || '');
                return !a || !b || a === b || a.startsWith(b + '/') || b.startsWith(a + '/');
            }

            async function scanDirHandle(handle, pathPrefix, generation, onImage, skipPath = null) {
                if (generation !== scanGeneration) return false;
                const currentPath = normalizePath(pathPrefix || '');
                folderHandleMap.set(currentPath, handle);
                let iterationCount = 0;
                for await (const entry of handle.values()) {
                    if (generation !== scanGeneration) return false;
                    iterationCount++;
                    if (entry.kind === 'file') {
                        const ext = entry.name.split('.').pop().toLowerCase();
                        if (imageExtensions.has(ext)) {
                            const file = await entry.getFile();
                            if (generation !== scanGeneration) return false;
                            onImage({
                                id: imageIdentityKey(currentPath, entry.name, file.size, file.lastModified),
                                handle: entry,
                                url: null,
                                name: entry.name,
                                folder: currentPath,
                                size: file.size,
                                modified: file.lastModified
                            });
                        }
                    } else if (entry.kind === 'directory') {
                        const childPath = currentPath ? `${currentPath}/${entry.name}` : entry.name;
                        folderHandleMap.set(childPath, entry);
                        if (skipPath && childPath === skipPath) continue;
                        const completed = await scanDirHandle(entry, childPath, generation, onImage, skipPath);
                        if (!completed) return false;
                    }
                    if (iterationCount % 50 === 0) {
                        await new Promise(resolve => setTimeout(resolve, 0));
                        if (generation !== scanGeneration) return false;
                    }
                }
                return generation === scanGeneration;
            }

            async function runFullScan(dirHandle, options = {}) {
                const generation = ++scanGeneration;
                const uiState = options.uiState || {};
                let priorityPath = normalizePath(
                    options.priorityPath ??
                    uiState.activeFolder ??
                    options.activeFolder ??
                    ''
                );
                activeFolder = normalizePath(
                    uiState.activeFolder ??
                    options.activeFolder ??
                    priorityPath
                );
                currentSort = uiState.currentSort || currentSort;
                sortSelect.value = currentSort;

                const expandedPathSet = new Set(
                    uiState.expandedFolders ||
                    options.expandedFolders ||
                    getExpandedFolderPaths()
                );
                getAncestorPaths(activeFolder).forEach(path => expandedPathSet.add(path));

                isScanning = true;
                currentRootDirHandle = dirHandle;
                currentRootFolder = dirHandle.name;
                folderHandleMap = new Map([['', dirHandle]]);
                updateSyncButtonVisibility();

                cleanupAllResources();
                allImages = [];
                searchInput.value = '';
                scrollContainer.scrollTop = 0;
                visibleContent.innerHTML = '';
                folderTree = buildFolderTree(allImages, currentRootFolder);
                renderTree([...expandedPathSet]);
                updateDisplay();

                const sidebar = document.getElementById('sidebar');
                const overlay = document.getElementById('sidebarOverlay');
                sidebar.classList.toggle('collapsed', !isMobileLayout() && !!uiState.sidebarCollapsedDesktop);
                sidebar.classList.remove('open');
                overlay.style.display = 'none';
                updateSidebarToggleIcon();

                let displayedScanSize = 0;
                let displayedScanFolders = new Set();
                let previewDisplayRevision = displayRevision;
                const dirtyCountNodes = new Set();
                let previewTimer = null;
                let lastPreviewAt = 0;
                const refreshScanPreview = () => {
                    previewTimer = null;
                    if (generation !== scanGeneration) return;
                    dirtyCountNodes.forEach(node => {
                        if (node._countEl) node._countEl.textContent = node.totalImages;
                    });
                    dirtyCountNodes.clear();
                    if (previewDisplayRevision !== displayRevision) {
                        displayedScanSize = 0;
                        displayedScanFolders = new Set();
                        for (const image of currentDisplayImages) {
                            displayedScanSize += image.size || 0;
                            displayedScanFolders.add(normalizePath(image.folder || '') || '__root__');
                        }
                        previewDisplayRevision = displayRevision;
                    }
                    statImages.textContent = currentDisplayImages.length;
                    statFolders.textContent = displayedScanFolders.size;
                    statSize.textContent = formatSize(displayedScanSize);
                    updateLayoutParams();
                    renderedStartIndex = -1;
                    renderedEndIndex = -1;
                    renderVisibleItems();
                    observeVisibleImages();
                    lastPreviewAt = performance.now();
                };
                const schedulePreview = () => {
                    if (previewTimer || generation !== scanGeneration) return;
                    const delay = Math.max(0, 300 - (performance.now() - lastPreviewAt));
                    previewTimer = setTimeout(() => requestAnimationFrame(refreshScanPreview), delay);
                };
                const appendScannedImage = image => {
                    ensureIncrementalFolderNode(
                        image.folder,
                        folderHandleMap.get(normalizePath(image.folder || '')) || null,
                        expandedPathSet
                    );
                    allImages.push(image);
                    incrementFolderCounts(image.folder, dirtyCountNodes);
                    if (imageMatchesCurrentFilters(image)) {
                        currentDisplayImages.push(image);
                        imageIndex.set(getImageId(image), image);
                        displayedScanSize += image.size || 0;
                        displayedScanFolders.add(normalizePath(image.folder || '') || '__root__');
                    }
                    schedulePreview();
                };

                try {
                    let priorityHandle = null;
                    if (priorityPath) {
                        try {
                            priorityHandle = await resolveDirectoryHandleByPath(dirHandle, priorityPath);
                        } catch (err) {
                            if (err.name && err.name !== 'NotFoundError') throw err;
                            priorityPath = '';
                            activeFolder = '';
                            expandedPathSet.clear();
                            expandedPathSet.add('');
                            renderTree([...expandedPathSet]);
                            updateDisplay();
                        }
                    }

                    if (priorityHandle) {
                        const priorityStartCount = allImages.length;
                        const priorityCompleted = await scanDirHandle(
                            priorityHandle,
                            priorityPath,
                            generation,
                            appendScannedImage
                        );
                        if (!priorityCompleted || generation !== scanGeneration) return false;
                        if (previewTimer) {
                            clearTimeout(previewTimer);
                            previewTimer = null;
                        }
                        refreshScanPreview();
                        if (allImages.length === priorityStartCount) {
                            priorityPath = '';
                            activeFolder = '';
                            expandedPathSet.clear();
                            expandedPathSet.add('');
                        }
                        updateDisplay();
                        await new Promise(resolve => requestAnimationFrame(resolve));
                    }

                    const completed = await scanDirHandle(
                        dirHandle,
                        '',
                        generation,
                        appendScannedImage,
                        priorityPath || null
                    );
                    if (!completed || generation !== scanGeneration) return false;
                    if (previewTimer) {
                        clearTimeout(previewTimer);
                        previewTimer = null;
                    }
                    refreshScanPreview();

                    const nextTree = buildFolderTree(allImages, currentRootFolder);
                    folderTree = nextTree;
                    if (activeFolder && !getFolderNode(activeFolder)) {
                        activeFolder = '';
                        expandedPathSet.add('');
                    }
                    renderTree([...expandedPathSet]);
                    updateDisplay();
                    if (window.innerWidth > 768 && uiState.sidebarCollapsedDesktop) {
                        setTimeout(requestLayoutRefresh, 320);
                    }
                    scheduleSaveUISettings();
                    return true;
                } finally {
                    if (previewTimer) clearTimeout(previewTimer);
                    if (generation === scanGeneration) isScanning = false;
                }
            }

            async function backgroundSync(targetHandle, targetPath) {
                if (isScanning || !targetHandle) return false;
                const currentGen = ++scanGeneration;
                const normalizedTarget = normalizePath(targetPath || '');
                const diskFilesMap = new Map();
                let completed = false;
                try {
                    completed = await scanDirHandle(targetHandle, normalizedTarget, currentGen, image => {
                        diskFilesMap.set(image.id, image);
                    });
                } catch (err) {
                    if (currentGen === scanGeneration) log('warn', 'Background sync failed', err);
                    return false;
                }
                if (!completed || currentGen !== scanGeneration) return false;
                const diskFilesByLocation = new Map(
                    [...diskFilesMap.values()].map(img => [fileLocationKey(img.folder, img.name), img])
                );

                const memoryFiles = allImages.filter(img => imageBelongsToFolder(img, normalizedTarget));
                const memoryFilesMap = new Map(
                    memoryFiles.map(img => [fileLocationKey(img.folder, img.name), img])
                );
                const removeSet = new Set();
                const additions = [];

                memoryFilesMap.forEach((memoryImage, locationKey) => {
                    const diskImage = diskFilesByLocation.get(locationKey);
                    if (!diskImage) {
                        removeSet.add(memoryImage);
                        revokeObjectUrl(memoryImage);
                        return;
                    }
                    if (memoryImage.size !== diskImage.size || memoryImage.modified !== diskImage.modified) {
                        revokeObjectUrl(memoryImage);
                        memoryImage.id = diskImage.id;
                        memoryImage.handle = diskImage.handle;
                        memoryImage.size = diskImage.size;
                        memoryImage.modified = diskImage.modified;
                    } else {
                        memoryImage.handle = diskImage.handle;
                    }
                });

                diskFilesByLocation.forEach((diskImage, locationKey) => {
                    if (!memoryFilesMap.has(locationKey)) additions.push(diskImage);
                });

                if (currentGen !== scanGeneration) return false;
                if (removeSet.size) allImages = allImages.filter(img => !removeSet.has(img));
                if (additions.length) allImages.push(...additions);
                refreshFolderTreeSilently();

                if (activeFolder !== null && pathsOverlap(activeFolder, normalizedTarget)) {
                    updateDisplay();
                }
                return true;
            }

            async function handleSelectFolder() {
                if (folderSelectionInProgress) return;
                folderSelectionInProgress = true;
                selectFolderBtn.disabled = true;
                try {
                    const dirHandle = await window.showDirectoryPicker();
                    const sidebar = document.getElementById('sidebar');
                    await idb.set('lastDirHandle', dirHandle);
                    await idb.set('uiState', {
                        activeFolder: '',
                        expandedFolders: [''],
                        sidebarCollapsedDesktop: sidebar.classList.contains('collapsed'),
                        currentSort
                    });
                    await idb.set('pendingRootSwitch', true);
                    location.reload();
                } catch (err) {
                    if (err.name !== 'AbortError') {
                        showToast('❌ 无法保存文件夹：' + err.message);
                    }
                } finally {
                    folderSelectionInProgress = false;
                    selectFolderBtn.disabled = false;
                }
            }

            async function handleSyncFolder() {
                if (isScanning) return;
                const targetPath = normalizePath(activeFolder || '');
                const targetNode = getFolderNode(targetPath);
                const targetHandle = targetNode && targetNode._handle;
                if (!targetHandle) return;

                syncFolderBtn.disabled = true;
                const originalText = syncFolderBtn.textContent;
                syncFolderBtn.textContent = '同步中...';
                try {
                    const completed = await backgroundSync(targetHandle, targetPath);
                    if (completed) showToast('✅ 当前目录已同步至最新状态');
                } catch (err) {
                    showToast('❌ 同步失败：' + err.message);
                } finally {
                    syncFolderBtn.disabled = false;
                    syncFolderBtn.textContent = originalText;
                }
            }

            async function autoRestoreLastSession() {
                try {
                    const [dirHandle, uiState, pendingRootSwitch] = await Promise.all([
                        idb.get('lastDirHandle'),
                        idb.get('uiState'),
                        idb.get('pendingRootSwitch')
                    ]);
                    if (pendingRootSwitch) {
                        await idb.set('pendingRootSwitch', false);
                    }
                    if (!dirHandle) return;
                    const permission = typeof dirHandle.queryPermission === 'function'
                        ? await dirHandle.queryPermission({ mode: 'read' })
                        : 'denied';
                    if (permission !== 'granted') return;
                    const restoredState = pendingRootSwitch
                        ? {
                            ...(uiState || {}),
                            activeFolder: '',
                            expandedFolders: ['']
                        }
                        : (uiState || {});
                    await runFullScan(dirHandle, {
                        uiState: restoredState,
                        priorityPath: restoredState.activeFolder
                    });
                } catch (err) {
                    log('warn', 'Automatic session restore failed', err);
                }
            }

            selectFolderBtn.addEventListener('click', handleSelectFolder);
            syncFolderBtn.addEventListener('click', handleSyncFolder);

            scrollContainer.addEventListener('scroll', onScroll, { passive: true });
            visibleContent.addEventListener('click', event => {
                const card = event.target.closest('.image-card');
                if (!card) return;
                const currentIndex = Number(card.dataset.index);
                if (Number.isInteger(currentIndex) &&
                    currentIndex >= 0 &&
                    currentIndex < currentDisplayImages.length) {
                    openLightbox(currentIndex, currentDisplayImages);
                }
            });
            
            // 优先使用 ResizeObserver，resize 事件作为降级方案并添加防抖
            let resizeDebounceTimer = null;
            const handleResize = () => {
                clearTimeout(resizeDebounceTimer);
                resizeDebounceTimer = setTimeout(() => {
                    const sidebar = document.getElementById('sidebar');
                    const overlay = document.getElementById('sidebarOverlay');
                    if (isMobileLayout()) {
                        sidebar.classList.remove('collapsed');
                    } else {
                        sidebar.classList.remove('open');
                        overlay.style.display = 'none';
                    }
                    updateSidebarToggleIcon();
                    requestLayoutRefresh();
                }, 150);
            };
            
            if (window.ResizeObserver) {
                resizeObserver = new ResizeObserver(handleResize);
                resizeObserver.observe(scrollContainer);
            } else {
                // 降级方案：使用 resize 事件
                window.addEventListener('resize', handleResize);
            }

            folderTree = null;
            renderTree();
            updateDisplay();
            updateSyncButtonVisibility();
            updateSidebarToggleIcon();
            autoRestoreLastSession();
            
            //  保存清理函数引用，用于页面卸载时移除 resize 监听器
            const cleanupResizeListener = () => {
                if (!window.ResizeObserver) {
                    window.removeEventListener('resize', handleResize);
                }
            };
            
            // 页面卸载时清理所有资源，防止内存泄漏
            window.addEventListener('beforeunload', () => {
                cleanupResizeListener();
                cleanupAllResources({ cleanupLayoutListeners: true });
            });
        })();
    </script>
</body>
</html>
