<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>本地图片浏览器</title>
    <style>
        :root {
            --bg: #f5f5f7;
            --card-bg: #ffffff;
            --text: #1d1d1f;
            --text-secondary: #6e6e73;
            --border: #e5e5ea;
            --accent: #0071e3;
            --accent-hover: #0077ed;
            --shadow: 0 2px 12px rgba(0,0,0,0.08);
            --shadow-hover: 0 8px 30px rgba(0,0,0,0.14);
            --tag-bg: #f0f0f5;
            --badge-folder: #f0f4ff; --badge-folder-text: #3b5ccc;
            --badge-size: #f0faf5; --badge-size-text: #2d8a56;
            --badge-date: #fdf6f0; --badge-date-text: #b87a3a;
            --sidebar-bg: #fafafa;
            --sidebar-width: 260px;
        }
        @media (prefers-color-scheme: dark) {
            :root { --bg: #1c1c1e; --card-bg: #2c2c2e; --text: #f5f5f7; --text-secondary: #a1a1a6; --border: #3a3a3c; --accent: #4da6ff; --tag-bg: #3a3a3c; --badge-folder: #1e2a45; --badge-folder-text: #8aadff; --badge-size: #1a3028; --badge-size-text: #5ec48a; --badge-date: #2e2418; --badge-date-text: #d4a05a; --sidebar-bg: #252528; }
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        html, body { height: 100%; overflow: hidden; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; background: var(--bg); color: var(--text); display:flex; }
        .sidebar {
            width: var(--sidebar-width); min-width: var(--sidebar-width);
            background: var(--sidebar-bg); border-right: 1px solid var(--border);
            display: flex; flex-direction: column; height: 100%;
            overflow-y: auto; overflow-x: hidden;
            z-index: 50; flex-shrink: 0;
            transition: margin-left 0.3s ease, transform 0.3s ease;
        }
        .sidebar.collapsed { transform: translateX(-100%); margin-left: calc(-1 * var(--sidebar-width)); border-right: 0; }
        .sidebar-header { padding: 14px 16px; font-weight: 700; font-size: 1rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
        .tree-container { flex: 1; padding: 8px 0; overflow-y: auto; }
        .tree-item {
            display: flex; align-items: center; padding: 4px 12px; cursor: pointer;
            font-size: 0.88rem; border-radius: 6px; margin: 1px 6px; transition: background 0.15s;
            white-space: nowrap; user-select: none;
        }
        .tree-item:hover { background: var(--tag-bg); }
        .tree-item.active { background: var(--accent); color: #fff; }
        .tree-item .folder-icon { font-size: 1rem; margin-right: 4px; flex-shrink: 0; }
        .tree-item .folder-name { overflow: hidden; text-overflow: ellipsis; flex:1; min-width:0; }
        .tree-item .count { font-size: 0.7rem; opacity: 0.7; margin-left: 4px; }
        .tree-children { padding-left: 12px; }
        .tree-toggle { width: 16px; height: 16px; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; margin-right: 2px; font-size: 0.7rem; }
        .tree-toggle.collapsed::before { content: '▶'; }
        .tree-toggle.expanded::before { content: '▼'; }
        .main-area { flex: 1; display: flex; flex-direction: column; height: 100%; min-width: 0; }
        .navbar {
            background: var(--card-bg);
            border-bottom:1px solid var(--border); padding:8px 16px;
            display:flex; align-items:center; gap:8px; flex-wrap:wrap;
            box-shadow:0 1px 4px rgba(0,0,0,0.04);
            flex-shrink: 0;
        }
        .logo { font-weight:700; font-size:1rem; white-space:nowrap; display:flex; align-items:center; gap:4px; }
        .btn { padding:5px 12px; border-radius:8px; border:1px solid var(--border); background:var(--card-bg); color:var(--text); cursor:pointer; font-size:0.78rem; font-weight:500; display:inline-flex; align-items:center; gap:4px; transition:all 0.2s; white-space:nowrap; }
        .btn:hover { background:var(--tag-bg); }
        .btn.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
        .btn.primary:hover { background:var(--accent-hover); }
        .search-wrapper { flex:1 1 auto; min-width:140px; max-width:280px; position:relative; }
        .search-wrapper input { width:100%; padding:5px 10px 5px 30px; border-radius:20px; border:1.5px solid var(--border); background:var(--bg); color:var(--text); outline:none; font-size:0.8rem; }
        .search-wrapper input:focus { border-color:var(--accent); }
        .search-icon { position:absolute; left:10px; top:50%; transform:translateY(-50%); font-size:0.75rem; opacity:0.5; pointer-events:none; }
        #sortSelect, #filterDateStart, #filterDateEnd {
            padding:4px 8px; border-radius:6px; border:1px solid var(--border);
            background:var(--bg); color:var(--text); font-size:0.75rem; white-space:nowrap;
        }
        .stats { display:flex; gap:5px; }
        .stat { font-size:0.7rem; padding:2px 6px; border-radius:10px; background:var(--tag-bg); }
        .scroll-container {
            flex:1; overflow-y:auto; overflow-x:hidden; position:relative;
            -webkit-overflow-scrolling: touch;
        }
        .scroll-placeholder { position:relative; width:100%; }
        .visible-content { position:absolute; top:0; left:0; width:100%; pointer-events:none; }
        .visible-content > * { pointer-events:auto; }
        .image-card {
            background:var(--card-bg); border-radius:12px; overflow:hidden;
            border:1px solid var(--border); box-shadow:var(--shadow); cursor:pointer;
            transition:transform 0.2s, box-shadow 0.2s; display:flex; flex-direction:column;
            position:absolute;
        }
        .image-card:hover { transform:translateY(-3px); box-shadow:var(--shadow-hover); }
        .img-container {
            width:100%; aspect-ratio:4/3; background:#e0e0e5;
            position:relative; overflow:hidden;
        }
        .img-container img {
            width:100%; height:100%; object-fit:cover; display:block;
            opacity:0; transition: opacity 0.3s;
        }
        .img-container img.loaded { opacity:1; }
        
        /* 图片加载动画 */
        .img-loading-placeholder {
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: loading-shimmer 1.5s infinite;
        }
        
        @keyframes loading-shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        
        @media (prefers-color-scheme: dark) {
            .img-loading-placeholder {
                background: linear-gradient(90deg, #3a3a3c 25%, #2c2c2e 50%, #3a3a3c 75%);
                background-size: 200% 100%;
            }
        }
        
        .card-info { padding:6px 10px 10px; display:flex; flex-direction:column; gap:3px; }
        .file-name { font-weight:600; font-size:0.78rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .meta-tag { font-size:0.65rem; padding:2px 5px; border-radius:4px; display:inline-flex; align-items:center; gap:2px; }
        .meta-tag.folder { background:var(--badge-folder); color:var(--badge-folder-text); max-width:130px; overflow:hidden; text-overflow:ellipsis; }
        .meta-tag.size { background:var(--badge-size); color:var(--badge-size-text); }
        .meta-tag.date { background:var(--badge-date); color:var(--badge-date-text); }

        /* 灯箱 */
        .lightbox {
            position:fixed; inset:0; z-index:1000; background:rgba(0,0,0,0.9);
            display:flex; flex-direction:column; align-items:center; justify-content:center;
        }
        .lightbox-img-wrapper {
            max-width:92vw; max-height:85vh; display:flex; align-items:center; justify-content:center;
            transition: transform 0.1s ease-out; overflow: hidden;
        }
        .lightbox-img-wrapper img {
            max-width:100%; max-height:85vh; border-radius:8px; object-fit:contain;
            transition: transform 0.1s ease-out;
        }
        .lightbox .close, .lightbox .nav {
            position:fixed; background:rgba(255,255,255,0.2); border:none; color:#fff;
            font-size:1.4rem; width:40px; height:40px; border-radius:50%; cursor:pointer;
            display:flex; align-items:center; justify-content:center; z-index:1010;
        }
        .lightbox .close { top:16px; right:16px; }
        .lightbox .nav.prev { left:12px; top:50%; transform:translateY(-50%); }
        .lightbox .nav.next { right:12px; top:50%; transform:translateY(-50%); }
        .lightbox-controls {
            position:fixed; bottom:20px; display:flex; gap:10px; z-index:1010;
            background:rgba(0,0,0,0.5); padding:6px 16px; border-radius:30px;
        }
        .lightbox-controls .btn {
            background:rgba(255,255,255,0.2); color:#fff; border:none; font-size:0.8rem;
            padding:5px 12px; border-radius:20px; cursor:pointer;
        }
        .toast {
            position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(100px);
            background:#333; color:#fff; padding:8px 20px; border-radius:20px; font-size:0.85rem;
            z-index:2000; transition:0.3s;
        }
        .toast.show { transform:translateX(-50%) translateY(0); }

        @media (max-width: 768px) {
            .sidebar { position: fixed; left:0; top:0; height:100%; transform: translateX(-100%); z-index: 200; }
            .sidebar.collapsed { width: var(--sidebar-width); min-width: var(--sidebar-width); margin-left: 0; border-right: 1px solid var(--border); }
            .sidebar.open { transform: translateX(0); box-shadow: 4px 0 20px rgba(0,0,0,0.3); }
            .sidebar-toggle { display: inline-flex !important; }
            .main-area { width: 100%; }
        }
        .sidebar-toggle { display: inline-flex; align-items:center; justify-content:center; width:32px; height:32px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 0; cursor: pointer; font-size: 1.1rem; line-height:1; }
    </style>
</head>
<body>
    <div id="sidebarOverlay" style="position:fixed;inset:0;background:rgba(0,0,0,0.3);z-index:199;display:none;" onclick="toggleSidebar()"></div>

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header"><span>📁 文件夹</span></div>
        <div class="tree-container" id="treeContainer"></div>
    </aside>

    <div class="main-area">
        <nav class="navbar">
            <button class="btn sidebar-toggle" id="sidebarToggleBtn" onclick="toggleSidebar()" aria-label="切换侧边栏">☰</button>
            <span class="logo">🖼️ 图片浏览器</span>
            <button class="btn primary" id="selectFolderBtn">📂 选择本地文件夹</button>
            <button class="btn" id="syncFolderBtn" style="display:none;">🔄 同步</button>
            <div class="search-wrapper">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" placeholder="搜索图片名称...">
            </div>
            <div class="stats">
                <span class="stat">📷 <span id="statImages">0</span></span>
                <span class="stat">📁 <span id="statFolders">0</span></span>
                <span class="stat">💾 <span id="statSize">0 B</span></span>
            </div>
            <select id="sortSelect">
                <option value="date-desc" selected>时间 ↓</option>
                <option value="date-asc">时间 ↑</option>
                <option value="name-asc">名称 ↑</option>
                <option value="name-desc">名称 ↓</option>
                <option value="size-desc">大小 ↓</option>
                <option value="size-asc">大小 ↑</option>
            </select>
            <input type="date" id="filterDateStart" title="开始日期">
            <input type="date" id="filterDateEnd" title="结束日期">
            <button class="btn" id="applyFilterBtn">筛选</button>
            <button class="btn" id="clearFilterBtn">清除</button>
        </nav>
        
        <div class="scroll-container" id="scrollContainer">
            <div class="scroll-placeholder" id="scrollPlaceholder"></div>
            <div class="visible-content" id="visibleContent"></div>
        </div>
    </div>

    <div class="lightbox" id="lightbox" style="display:none;">
        <button class="close" id="lightboxClose">✕</button>
        <button class="nav prev" id="lightboxPrev">◀</button>
        <button class="nav next" id="lightboxNext">▶</button>
        <div class="lightbox-img-wrapper" id="lightboxImgWrapper">
            <img id="lightboxImg" src="" alt="">
        </div>
        <div class="lightbox-controls">
            <button class="btn" id="lightboxZoomIn">🔍+</button>
            <button class="btn" id="lightboxZoomOut">🔍-</button>
            <button class="btn" id="lightboxReset">↺ 原始</button>
            <button class="btn" id="lightboxFullscreen">⛶ 全屏</button>
            <button class="btn" id="lightboxCopy">📋 复制图片</button>
        </div>
    </div>
    <div class="toast" id="toast"></div>

    <script>
        (() => {
            const treeContainer = document.getElementById('treeContainer');
            const searchInput = document.getElementById('searchInput');
            const statImages = document.getElementById('statImages');
            const statFolders = document.getElementById('statFolders');
            const statSize = document.getElementById('statSize');
            const selectFolderBtn = document.getElementById('selectFolderBtn');
            const lightbox = document.getElementById('lightbox');
            const lightboxImg = document.getElementById('lightboxImg');
            const lightboxImgWrapper = document.getElementById('lightboxImgWrapper');
            const lightboxClose = document.getElementById('lightboxClose');
            const lightboxPrev = document.getElementById('lightboxPrev');
            const lightboxNext = document.getElementById('lightboxNext');
            const lightboxZoomIn = document.getElementById('lightboxZoomIn');
            const lightboxZoomOut = document.getElementById('lightboxZoomOut');
            const lightboxReset = document.getElementById('lightboxReset');
            const lightboxFullscreen = document.getElementById('lightboxFullscreen');
            const lightboxCopy = document.getElementById('lightboxCopy');
            const toast = document.getElementById('toast');
            const scrollContainer = document.getElementById('scrollContainer');
            const scrollPlaceholder = document.getElementById('scrollPlaceholder');
            const visibleContent = document.getElementById('visibleContent');

            const sortSelect = document.getElementById('sortSelect');
            const filterDateStart = document.getElementById('filterDateStart');
            const filterDateEnd = document.getElementById('filterDateEnd');
            const applyFilterBtn = document.getElementById('applyFilterBtn');
            const clearFilterBtn = document.getElementById('clearFilterBtn');
            const syncFolderBtn = document.getElementById('syncFolderBtn');

            const idb = {
                _dbPromise: null,
                open() {
                    if (this._dbPromise) return this._dbPromise;
                    this._dbPromise = new Promise((resolve, reject) => {
                        const request = indexedDB.open('settingsDB', 1);
                        request.onupgradeneeded = () => {
                            const db = request.result;
                            if (!db.objectStoreNames.contains('config')) {
                                db.createObjectStore('config');
                            }
                        };
                        request.onsuccess = () => resolve(request.result);
                        request.onerror = () => reject(request.error);
                    });
                    return this._dbPromise;
                },
                async get(key) {
                    const db = await this.open();
                    return new Promise((resolve, reject) => {
                        const tx = db.transaction('config', 'readonly');
                        const request = tx.objectStore('config').get(key);
                        request.onsuccess = () => resolve(request.result);
                        request.onerror = () => reject(request.error);
                    });
                },
                async set(key, value) {
                    const db = await this.open();
                    return new Promise((resolve, reject) => {
                        const tx = db.transaction('config', 'readwrite');
                        const request = tx.objectStore('config').put(value, key);
                        request.onsuccess = () => resolve();
                        request.onerror = () => reject(request.error);
                    });
                }
            };

            let allImages = [];
            let folderTree = null;
            let activeFolder = null;
            let currentRootFolder = ''; //  存储用户选择的根文件夹名称
            let currentDisplayImages = [];
            let imageIndex = new Map();
            let displayRevision = 0;
            const imageExtensions = new Set(['jpg','jpeg','png','gif','webp','bmp','svg','tiff','tif','avif','ico','heic','heif','jfif']);
            
            let rowHeight = 260;
            let columnCount = 4;
            let containerWidth = 0;
            let gap = 12;
            
            let loadingBatchTimer = null;
            let loadingBatchTimers = [];
            let loadGeneration = 0;
            let isScrolling = false;
            let scrollPauseTimer = null;
            
            let renderedStartIndex = 0;
            let renderedEndIndex = 0;
            let resizeObserver = null;
            let ticking = false;
            let currentScale = 1;
            let currentSort = 'date-desc';
            
            let panX = 0;
            let panY = 0;
            let isPanning = false;
            let startX = 0;
            let startY = 0;
            
            let searchDebounceTimer = null;
            let objectUrlSet = new Set();
            let folderSelectionInProgress = false;
            let scanGeneration = 0;
            let isScanning = false;
            let currentRootDirHandle = null;
            let folderHandleMap = new Map();
            let saveUISettingsTimer = null;

            const CONFIG = {
                VIEWPORT_BUFFER: 200,
                ROW_OVERSCAN: 3,
                SCROLL_STOP_DELAY: 50,
                SWIPE_THRESHOLD: 50,
                SEARCH_DEBOUNCE: 300,
                MIN_BATCH: 1,
                MAX_BATCH: 20,
                HALF_SIZE: 1 * 1024 * 1024,
                BATCH_INTERVAL: 100,
                THUMBNAIL_SIZE_THRESHOLD: 500 * 1024,
                THUMBNAIL_MAX_WIDTH: 400,
                THUMBNAIL_MAX_HEIGHT: 300,
                THUMBNAIL_QUALITY: 0.8,
                LRU_CACHE_MAX_SIZE: 200,
                MAX_RETAINED_CARDS: 500,
                IMAGE_LOAD_STALE_TIMEOUT: 20000,
                LOG_LEVEL: 'warn', // 'debug' | 'info' | 'warn' | 'error' | 'none'
            };

            // 日志工具函数
            function log(level, ...args) {
                const levels = { debug: 0, info: 1, warn: 2, error: 3, none: 4 };
                const currentLevel = levels[CONFIG.LOG_LEVEL] || 1;
                const messageLevel = levels[level] || 1;
                
                if (messageLevel >= currentLevel) {
                    const timestamp = new Date().toLocaleTimeString();
                    console[level === 'error' ? 'error' : level === 'warn' ? 'warn' : 'log'](
                        `[${timestamp}] [${level.toUpperCase()}]`,
                        ...args
                    );
                }
            }

            class ThumbnailLRUCache {
                constructor(maxSize) {
                    this.maxSize = maxSize;
                    this.cache = new Map();
                }
                
                get(imageUrl) {
                    if (!this.cache.has(imageUrl)) return null;
                    const item = this.cache.get(imageUrl);
                    item.lastAccess = Date.now();
                    return item.blobUrl;
                }
                
                set(imageUrl, blobUrl) {
                    if (this.cache.has(imageUrl)) {
                        this.cache.delete(imageUrl);
                    }
                    this.cache.set(imageUrl, { blobUrl, lastAccess: Date.now() });
                    if (this.cache.size > this.maxSize) this.evict();
                }
                
                has(imageUrl) { return this.cache.has(imageUrl); }
                
                delete(imageUrl) {
                    if (this.cache.has(imageUrl)) {
                        const item = this.cache.get(imageUrl);
                        try { URL.revokeObjectURL(item.blobUrl); } catch (e) {}
                        this.cache.delete(imageUrl);
                    }
                }
                
                clear() {
                    for (const [, item] of this.cache) {
                        try { URL.revokeObjectURL(item.blobUrl); } catch (e) {}
                    }
                    this.cache.clear();
                }
                
                evict() {
                    let oldestKey = null, oldestTime = Infinity;
                    for (const [key, item] of this.cache) {
                        if (item.lastAccess < oldestTime) {
                            oldestTime = item.lastAccess;
                            oldestKey = key;
                        }
                    }
                    if (oldestKey) this.delete(oldestKey);
                }
                
                get size() { return this.cache.size; }
            }

            const thumbnailCache = new ThumbnailLRUCache(CONFIG.LRU_CACHE_MAX_SIZE);

            function formatSize(bytes) {
                if (!bytes) return '0 B';
                const u = ['B','KB','MB','GB']; let i=0;
                while(bytes>=1024 && i<3){bytes/=1024;i++;}
                return bytes.toFixed(i?1:0)+' '+u[i];
            }
            
            // 只 revoke 已跟踪 URL；img.src 由加载生命周期单独处理
            function cleanupObjectUrls() {
                objectUrlSet.forEach(url => {
                    try {
                        URL.revokeObjectURL(url);
                    } catch (e) {
                        console.warn('Failed to revoke URL:', e);
                    }
                });
                objectUrlSet.clear();
                allImages.forEach(img => {
                    if (img.url && img.url.startsWith('blob:')) img.url = null;
                });
            }

            // 工作线程池配置
            let activeWorkers = 0;
            const MAX_CONCURRENT_WORKERS = 3;
            let workerQueue = [];

            // 加载图片到内存
            function loadImageToMemory(imageUrl) {
                return new Promise((resolve, reject) => {
                    const img = new Image();
                    img.onload = () => resolve(img);
                    img.onerror = () => reject(new Error('Failed to load image'));
                    img.src = imageUrl;
                });
            }

            // 从 Image 对象生成缩略图
            async function generateThumbnailFromImage(img, maxWidth, maxHeight) {
                const scale = Math.min(maxWidth / img.width, maxHeight / img.height, 1);
                const width = Math.floor(img.width * scale);
                const height = Math.floor(img.height * scale);
                
                const bitmap = await createImageBitmap(img, 0, 0, img.width, img.height, {
                    resizeWidth: width,
                    resizeHeight: height,
                    resizeQuality: 'medium'
                });
                
                const canvas = document.createElement('canvas');
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(bitmap, 0, 0);
                bitmap.close();
                
                return new Promise((resolve, reject) => {
                    canvas.toBlob((blob) => {
                        if (blob) {
                            resolve(URL.createObjectURL(blob));
                        } else {
                            reject(new Error('Failed to create blob'));
                        }
                    }, 'image/jpeg', CONFIG.THUMBNAIL_QUALITY);
                });
            }

            // 原子化任务：加载大图 → 生成缩略图 → 释放资源 → 返回缩略图URL
            async function atomicThumbnailTask(imageUrl) {
                // 步骤1：加载大图到内存
                const fullImage = await loadImageToMemory(imageUrl);
                
                try {
                    // 步骤2：生成缩略图
                    const thumbnailBlobUrl = await generateThumbnailFromImage(
                        fullImage, 
                        CONFIG.THUMBNAIL_MAX_WIDTH, 
                        CONFIG.THUMBNAIL_MAX_HEIGHT
                    );
                    
                    // 步骤3：释放大图资源
                    fullImage.src = '';
                    
                    // 步骤4：返回缩略图URL
                    return thumbnailBlobUrl;
                } catch (err) {
                    // 确保异常时也释放资源
                    fullImage.src = '';
                    throw err;
                }
            }

            // 工作线程调度器
            function scheduleWorkerTask(task) {
                return new Promise((resolve, reject) => {
                    workerQueue.push({ task, resolve, reject });
                    processWorkerQueue();
                });
            }

            function clearWorkerQueue(reason = 'cancelled') {
                const pending = workerQueue.splice(0);
                pending.forEach(({ reject }) => {
                    try { reject(new Error(reason)); } catch (e) {}
                });
            }

            function clearImageLoadQueue() {
                loadGeneration++;
                if (loadingBatchTimer) {
                    clearTimeout(loadingBatchTimer);
                    loadingBatchTimer = null;
                }
                loadingBatchTimers.forEach(({ timer, batch }) => {
                    clearTimeout(timer);
                    releaseScheduledBatch(batch);
                });
                loadingBatchTimers = [];
                clearWorkerQueue('image load queue cleared');
                visibleContent.querySelectorAll('img[data-scheduled]').forEach(img => {
                    resetImageLoadState(img, true);
                });
            }

            function releaseScheduledBatch(batch) {
                batch.forEach(({ element }) => {
                    if (element.dataset.scheduled === 'small') {
                        resetImageLoadState(element, false);
                    }
                });
            }

            function markImageScheduled(img, type) {
                img.dataset.scheduled = type;
                img.dataset.scheduledAt = String(Date.now());
            }

            function resetImageLoadState(img, clearSrc = false) {
                delete img.dataset.scheduled;
                delete img.dataset.scheduledAt;
                delete img.dataset.loadingStarted;
                if (clearSrc && !img.classList.contains('loaded') && !img.classList.contains('error')) {
                    img.src = '';
                }
            }

            function resetStaleLoadingImages() {
                const now = Date.now();
                visibleContent.querySelectorAll('img[data-src]').forEach(img => {
                    if (img.classList.contains('loaded') || img.classList.contains('error')) return;
                    const scheduledAt = Number(img.dataset.scheduledAt || 0);
                    const loadingStarted = Number(img.dataset.loadingStarted || 0);
                    const startTime = loadingStarted || scheduledAt;
                    if (startTime && now - startTime > CONFIG.IMAGE_LOAD_STALE_TIMEOUT) {
                        resetImageLoadState(img, true);
                    }
                });
            }

            function resetFailedImagesInCurrentDisplay() {
                const currentIds = new Set(currentDisplayImages.map(getImageId));
                visibleContent.querySelectorAll('img.error[data-src]').forEach(img => {
                    if (!currentIds.has(img.dataset.src)) return;
                    img.classList.remove('error');
                    img.src = '';
                    resetImageLoadState(img);
                    const placeholder = img.parentElement.querySelector('.img-loading-placeholder');
                    if (placeholder) {
                        placeholder.classList.remove('error');
                        placeholder.innerHTML = '';
                    }
                });
            }

            async function processWorkerQueue() {
                // 如果已达到最大工作线程数或队列为空，等待
                if (activeWorkers >= MAX_CONCURRENT_WORKERS || workerQueue.length === 0) {
                    return;
                }
                
                const { task, resolve, reject } = workerQueue.shift();
                activeWorkers++;
                
                try {
                    const result = await task();
                    resolve(result);
                } catch (err) {
                    reject(err);
                } finally {
                    activeWorkers--;
                    // 继续处理下一个任务
                    if (workerQueue.length > 0) {
                        setTimeout(processWorkerQueue, 0);
                    }
                }
            }

            function cleanupAllResources({ cleanupLayoutListeners = false } = {}) {
                clearImageLoadQueue();

                if (scrollPauseTimer) {
                    clearTimeout(scrollPauseTimer);
                    scrollPauseTimer = null;
                }

                if (searchDebounceTimer) {
                    clearTimeout(searchDebounceTimer);
                    searchDebounceTimer = null;
                }

                if (resizeDebounceTimer) {
                    clearTimeout(resizeDebounceTimer);
                    resizeDebounceTimer = null;
                }

                isScrolling = false;
                cleanupObjectUrls();
                thumbnailCache.clear();

                if (cleanupLayoutListeners && resizeObserver) {
                    resizeObserver.disconnect();
                    resizeObserver = null;
                }
            }
            
            // 动态批次大小计算（指数衰减策略）
            function getBatchSize(fileSize) {
                return Math.max(CONFIG.MIN_BATCH, Math.round(CONFIG.MAX_BATCH * Math.exp(-fileSize / CONFIG.HALF_SIZE)));
            }

            function formatDate(ms) {
                if(!ms) return '';
                const d=new Date(ms);
                return d.getFullYear()+'-'+(d.getMonth()+1).toString().padStart(2,'0')+'-'+d.getDate().toString().padStart(2,'0');
            }
            function escapeHtml(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
            
            function isInViewport(imgElement) {
                if (!imgElement.isConnected) return false;
                const rect = imgElement.getBoundingClientRect();
                const viewHeight = window.innerHeight || document.documentElement.clientHeight;
                // 判断图片是否与扩展后的视口相交
                return rect.bottom >= -CONFIG.VIEWPORT_BUFFER && rect.top <= viewHeight + CONFIG.VIEWPORT_BUFFER;
            }

            function showToast(msg){
                toast.textContent=msg; toast.classList.add('show');
                clearTimeout(window._toastTimer);
                window._toastTimer = setTimeout(()=>toast.classList.remove('show'),2000);
            }
            function normalizePath(p) {
                if (!p) return '';
                return p.replace(/\\/g, '/').trim().replace(/\/+$/, '');
            }

            function imageIdentityKey(folder, name, size, modified) {
                return `${normalizePath(folder || '')}/${name}:${size || 0}:${modified || 0}`;
            }

            function fileLocationKey(folder, name) {
                return `${normalizePath(folder || '')}/${name}`;
            }

            function getAncestorPaths(path) {
                const parts = normalizePath(path || '').split('/').filter(Boolean);
                const result = [''];
                for (let i = 0; i < parts.length; i++) {
                    result.push(parts.slice(0, i + 1).join('/'));
                }
                return result;
            }

            async function resolveDirectoryHandleByPath(rootHandle, path) {
                const normalized = normalizePath(path || '');
                if (!normalized) return rootHandle;

                let handle = rootHandle;
                let currentPath = '';
                for (const part of normalized.split('/')) {
                    handle = await handle.getDirectoryHandle(part);
                    currentPath = currentPath ? `${currentPath}/${part}` : part;
                    folderHandleMap.set(currentPath, handle);
                }
                return handle;
            }

            function getImageId(img) {
                if (!img.id) {
                    img.id = imageIdentityKey(img.folder, img.name, img.size, img.modified);
                }
                return img.id;
            }

            function rebuildImageIndex() {
                imageIndex.clear();
                for (const img of currentDisplayImages) {
                    imageIndex.set(getImageId(img), img);
                }
            }

            async function ensureImageObjectUrl(imgData) {
                if (imgData.url && imgData.url.startsWith('blob:')) return imgData.url;
                if (!imgData.handle) return imgData.url || '';
                const file = await imgData.handle.getFile();
                const url = URL.createObjectURL(file);
                objectUrlSet.add(url);
                imgData.url = url;
                return url;
            }

            function revokeObjectUrl(imgData) {
                if (!imgData || !imgData.url) return;
                try { URL.revokeObjectURL(imgData.url); } catch (e) {}
                objectUrlSet.delete(imgData.url);
                thumbnailCache.delete(getImageId(imgData));
                imgData.url = null;
            }

            function updateSyncButtonVisibility() {
                syncFolderBtn.style.display = currentRootDirHandle ? 'inline-flex' : 'none';
            }

            function getExpandedFolderPaths() {
                const paths = [];
                treeContainer.querySelectorAll('.tree-children').forEach(children => {
                    if (children.style.display === 'none') return;
                    const item = children.previousElementSibling;
                    if (!item || !item.classList.contains('tree-item')) return;
                    paths.push(item.dataset.path === '__root__' ? '' : normalizePath(item.dataset.path || ''));
                });
                return paths;
            }

            function scheduleSaveUISettings() {
                clearTimeout(saveUISettingsTimer);
                saveUISettingsTimer = setTimeout(async () => {
                    const sidebar = document.getElementById('sidebar');
                    const uiState = {
                        activeFolder,
                        expandedFolders: getExpandedFolderPaths(),
                        sidebarCollapsedDesktop: sidebar.classList.contains('collapsed'),
                        currentSort
                    };
                    try {
                        await idb.set('uiState', uiState);
                    } catch (err) {
                        log('warn', 'Failed to save UI settings', err);
                    }
                }, 300);
            }

            function getFolderNode(path) {
                if (!folderTree) return null;
                const normalized = normalizePath(path || '');
                if (!normalized) return folderTree;
                return normalized.split('/').reduce((node, part) => node && node.children[part], folderTree);
            }

            function createFolderNode(name, path, handle = null) {
                return {
                    name,
                    path,
                    children: {},
                    totalImages: 0,
                    _handle: handle,
                    _countEl: null,
                    _toggleEl: null,
                    _childrenEl: null
                };
            }

            function ensureFolderDataNode(root, path, handle = null) {
                const normalized = normalizePath(path || '');
                if (!normalized) {
                    if (handle) root._handle = handle;
                    return root;
                }
                let node = root;
                const parts = normalized.split('/');
                parts.forEach((part, idx) => {
                    const currentPath = parts.slice(0, idx + 1).join('/');
                    if (!node.children[part]) {
                        node.children[part] = createFolderNode(
                            part,
                            currentPath,
                            folderHandleMap.get(currentPath) || null
                        );
                    }
                    node = node.children[part];
                    if (!node._handle) node._handle = folderHandleMap.get(currentPath) || null;
                });
                if (handle) node._handle = handle;
                return node;
            }

            function isMobileLayout() {
                return window.innerWidth <= 768;
            }

            function updateSidebarToggleIcon() {
                const btn = document.getElementById('sidebarToggleBtn');
                const sidebar = document.getElementById('sidebar');
                if (!btn) return;
                if (isMobileLayout()) {
                    btn.textContent = sidebar.classList.contains('open') ? '✕' : '☰';
                } else {
                    btn.textContent = sidebar.classList.contains('collapsed') ? '▶' : '◀';
                }
            }

            window.toggleSidebar = function() {
                const sidebar = document.getElementById('sidebar');
                const overlay = document.getElementById('sidebarOverlay');
                if (isMobileLayout()) {
                    const shouldOpen = !sidebar.classList.contains('open');
                    sidebar.classList.toggle('open', shouldOpen);
                    overlay.style.display = shouldOpen ? 'block' : 'none';
                } else {
                    sidebar.classList.toggle('collapsed');
                    overlay.style.display = 'none';
                    const onSidebarTransitionEnd = event => {
                        if (event.propertyName !== 'margin-left') return;
                        requestLayoutRefresh();
                    };
                    sidebar.addEventListener('transitionend', onSidebarTransitionEnd, { once: true });
                    setTimeout(requestLayoutRefresh, 350);
                }
                updateSidebarToggleIcon();
                scheduleSaveUISettings();
            };

            function requestLayoutRefresh() {
                updateLayoutParams();
                renderedStartIndex = -1;
                renderedEndIndex = -1;
                renderVisibleItems();
                observeVisibleImages();
            }

            function buildFolderTree(images, rootFolderName = '') {
                const root = createFolderNode(rootFolderName || '根目录', '', currentRootDirHandle);
                images.forEach(img => {
                    const folder = normalizePath(img.folder || '');
                    root.totalImages++;
                    const node = ensureFolderDataNode(root, folder);
                    if (node !== root) node.totalImages++;
                    if (folder) {
                        const parts = folder.split('/');
                        let parent = root;
                        for (let i = 0; i < parts.length - 1; i++) {
                            parent = parent.children[parts[i]];
                            parent.totalImages++;
                        }
                    }
                });
                return root;
            }

            function setTreeNodeExpanded(node, expanded) {
                if (!node._childrenEl || !node._toggleEl) return;
                node._childrenEl.style.display = expanded ? 'block' : 'none';
                node._toggleEl.classList.toggle('expanded', expanded);
                node._toggleEl.classList.toggle('collapsed', !expanded);
            }

            function createTreeItemElement(node, level) {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'tree-item';
                itemDiv.dataset.path = node.path === '' ? '__root__' : node.path;
                if (activeFolder === node.path) itemDiv.classList.add('active');
                if (level > 0) itemDiv.style.paddingLeft = (12 + level * 14) + 'px';

                const toggleSpan = document.createElement('span');
                toggleSpan.className = 'tree-toggle';
                itemDiv.appendChild(toggleSpan);

                const icon = document.createElement('span');
                icon.className = 'folder-icon';
                icon.textContent = node.path === '' ? '📂' : '📁';
                itemDiv.appendChild(icon);

                const nameSpan = document.createElement('span');
                nameSpan.className = 'folder-name';
                nameSpan.textContent = node.name;
                itemDiv.appendChild(nameSpan);

                const countSpan = document.createElement('span');
                countSpan.className = 'count';
                countSpan.textContent = node.totalImages;
                itemDiv.appendChild(countSpan);

                node._toggleEl = toggleSpan;
                node._countEl = countSpan;
                return { itemDiv, toggleSpan, countSpan };
            }

            function bindTreeItemEvents(itemDiv, toggleSpan, node) {
                toggleSpan.onclick = (event) => {
                    event.stopPropagation();
                    if (!node._childrenEl) return;
                    setTreeNodeExpanded(node, node._childrenEl.style.display === 'none');
                    scheduleSaveUISettings();
                };

                itemDiv.onclick = () => {
                    if (node._childrenEl && node._childrenEl.style.display === 'none') {
                        setTreeNodeExpanded(node, true);
                        scheduleSaveUISettings();
                    }
                    setActiveFolder(node.path);
                };
            }

            function ensureFolderDomNode(parentNode, node, expandedPathSet) {
                if (node._toggleEl && node._toggleEl.isConnected) return;
                const shouldExpand = parentNode._childrenEl
                    ? parentNode._childrenEl.style.display !== 'none'
                    : expandedPathSet.has(parentNode.path);
                if (!parentNode._childrenEl) {
                    const childrenDiv = document.createElement('div');
                    childrenDiv.className = 'tree-children';
                    childrenDiv.style.display = shouldExpand ? 'block' : 'none';
                    parentNode._childrenEl = childrenDiv;
                    const parentItem = parentNode._toggleEl && parentNode._toggleEl.parentElement;
                    if (parentItem) parentItem.insertAdjacentElement('afterend', childrenDiv);
                }
                setTreeNodeExpanded(parentNode, shouldExpand);

                const level = node.path ? node.path.split('/').length : 0;
                const { itemDiv, toggleSpan } = createTreeItemElement(node, level);
                bindTreeItemEvents(itemDiv, toggleSpan, node);
                parentNode._childrenEl.appendChild(itemDiv);
            }

            function renderTree(expandedPaths = null) {
                const expanded = expandedPaths
                    ? new Set(expandedPaths.map(path => normalizePath(path || '')))
                    : new Set(getExpandedFolderPaths());
                treeContainer.innerHTML = '';
                if (!folderTree) {
                    treeContainer.innerHTML = '<div style="padding:20px;color:var(--text-secondary);">暂无文件夹</div>';
                    return;
                }

                function renderChildren(container, node, level) {
                    const { itemDiv, toggleSpan } = createTreeItemElement(node, level);
                    bindTreeItemEvents(itemDiv, toggleSpan, node);
                    container.appendChild(itemDiv);
                    if (Object.keys(node.children).length === 0) return;

                    const childrenDiv = document.createElement('div');
                    childrenDiv.className = 'tree-children';
                    node._childrenEl = childrenDiv;
                    Object.values(node.children).forEach(child => renderChildren(childrenDiv, child, level + 1));
                    container.appendChild(childrenDiv);
                    setTreeNodeExpanded(node, expanded.has(node.path));
                }

                renderChildren(treeContainer, folderTree, 0);
            }

            function ensureIncrementalFolderNode(path, handle, expandedPathSet) {
                if (!folderTree) return null;
                const normalized = normalizePath(path || '');
                if (!normalized) return ensureFolderDataNode(folderTree, '', handle);

                let parentNode = folderTree;
                const parts = normalized.split('/');
                parts.forEach((part, index) => {
                    const currentPath = parts.slice(0, index + 1).join('/');
                    const node = ensureFolderDataNode(folderTree, currentPath);
                    ensureFolderDomNode(parentNode, node, expandedPathSet);
                    parentNode = node;
                });
                if (handle) parentNode._handle = handle;
                return parentNode;
            }

            function incrementFolderCounts(folderPath, dirtyNodes) {
                if (!folderTree) return;
                folderTree.totalImages++;
                dirtyNodes.add(folderTree);
                const normalized = normalizePath(folderPath || '');
                if (!normalized) return;
                let node = folderTree;
                for (const part of normalized.split('/')) {
                    node = node.children[part];
                    if (!node) return;
                    node.totalImages++;
                    dirtyNodes.add(node);
                }
            }

            function setActiveFolder(path) {
                //  空字符串表示根目录，null 表示未选择
                const normalized = path === null ? null : normalizePath(path || '');
                clearImageLoadQueue();
                activeFolder = normalized;
                searchInput.value = '';
                scrollContainer.scrollTop = 0;
                updateDisplay();
                resetFailedImagesInCurrentDisplay();
                observeVisibleImages();
                if (window.innerWidth <= 768) {
                    document.getElementById('sidebar').classList.remove('open');
                    document.getElementById('sidebarOverlay').style.display = 'none';
                }
                scheduleSaveUISettings();
                if (!isScanning && normalized !== null) {
                    const node = getFolderNode(normalized);
                    if (node && node._handle) backgroundSync(node._handle, normalized);
                }
            }

            function imageBelongsToFolder(img, folderPath) {
                if (folderPath === '') return true;
                const imgFolder = normalizePath(img.folder || '');
                return imgFolder === folderPath || imgFolder.startsWith(folderPath + '/');
            }

            function imageMatchesCurrentFilters(img) {
                if (activeFolder !== null && !imageBelongsToFolder(img, activeFolder)) return false;

                const query = searchInput.value.trim().toLowerCase();
                if (query && !img.name.toLowerCase().includes(query)) return false;

                const startValue = filterDateStart.value;
                const endValue = filterDateEnd.value;
                if (startValue || endValue) {
                    const start = startValue ? new Date(startValue + 'T00:00:00').getTime() : null;
                    const end = endValue ? new Date(endValue + 'T23:59:59.999').getTime() : null;
                    const time = img.modified || 0;
                    if (start && time < start) return false;
                    if (end && time > end) return false;
                }

                return true;
            }

            function measureRowHeight() {
                const tempCard = createCardElement({ url: '', name: '测量用', folder: '测试', size: 1024, modified: Date.now() }, 0);
                tempCard.style.position = 'fixed';
                tempCard.style.visibility = 'hidden';
                tempCard.style.left = '0';
                tempCard.style.top = '0';
                const colWidth = (containerWidth - gap * (columnCount - 1)) / columnCount;
                tempCard.style.width = colWidth + 'px';
                document.body.appendChild(tempCard);
                const height = tempCard.getBoundingClientRect().height;
                document.body.removeChild(tempCard);
                return height || 260;
            }

            function updateLayoutParams() {
                const oldWidth = containerWidth;
                containerWidth = scrollContainer.clientWidth;
                if (containerWidth <= 0) return;
                const minColWidth = 180;
                columnCount = Math.max(1, Math.floor((containerWidth + gap) / (minColWidth + gap)));
                if (containerWidth !== oldWidth || rowHeight === 260) {
                    rowHeight = measureRowHeight();
                }
            }

            function getTotalHeight() {
                if (currentDisplayImages.length === 0) return 0;
                const rows = Math.ceil(currentDisplayImages.length / columnCount);
                return rows * rowHeight + (rows - 1) * gap;
            }

            function renderVisibleItems() {
                if (!scrollContainer || currentDisplayImages.length === 0) {
                    Array.from(visibleContent.children).forEach(card => card.remove());
                    scrollPlaceholder.style.height = '0px';
                    return;
                }
                
                const scrollTop = scrollContainer.scrollTop;
                const viewHeight = scrollContainer.clientHeight;
                const totalItems = currentDisplayImages.length;
                const startRow = Math.max(0, Math.floor(scrollTop / (rowHeight + gap)) - CONFIG.ROW_OVERSCAN);
                const endRow = Math.min(Math.ceil(totalItems / columnCount), Math.ceil((scrollTop + viewHeight) / (rowHeight + gap)) + CONFIG.ROW_OVERSCAN);
                const startIndex = startRow * columnCount;
                const endIndex = Math.min(totalItems, endRow * columnCount);
                
                if (startIndex === renderedStartIndex && endIndex === renderedEndIndex) return;
                renderedStartIndex = startIndex;
                renderedEndIndex = endIndex;
                
                const existingCards = Array.from(visibleContent.children);
                const existingMap = new Map();
                existingCards.forEach(card => existingMap.set(card.dataset.imageId, card));
                
                const newVisibleIds = new Set();
                const colWidth = (containerWidth - gap * (columnCount - 1)) / columnCount;
                const now = Date.now();
                
                for (let i = startIndex; i < endIndex; i++) {
                    const img = currentDisplayImages[i];
                    const imageId = getImageId(img);
                    newVisibleIds.add(imageId);
                    
                    let card = existingMap.get(imageId);
                    const row = Math.floor(i / columnCount);
                    const col = i % columnCount;
                    const left = col * (colWidth + gap);
                    const top = row * (rowHeight + gap);
                    
                    if (!card) {
                        card = createCardElement(img, i);
                        card.style.width = colWidth + 'px';
                        card.style.left = left + 'px';
                        card.style.top = top + 'px';
                        visibleContent.appendChild(card);
                    } else {
                        card.style.display = '';
                        card.style.left = left + 'px';
                        card.style.top = top + 'px';
                        card.dataset.index = i;
                    }
                    card.dataset.lastVisibleAt = String(now);
                }
                
                existingCards.forEach(card => {
                    if (!newVisibleIds.has(card.dataset.imageId)) {
                        card.style.display = 'none';
                    }
                });

                const retainedCards = Array.from(visibleContent.children);
                if (retainedCards.length > CONFIG.MAX_RETAINED_CARDS) {
                    const hiddenCards = retainedCards
                        .filter(card => card.style.display === 'none')
                        .sort((a, b) => Number(a.dataset.lastVisibleAt || 0) - Number(b.dataset.lastVisibleAt || 0));
                    const removeCount = retainedCards.length - CONFIG.MAX_RETAINED_CARDS;
                    hiddenCards.slice(0, removeCount).forEach(card => card.remove());
                }
                
                scrollPlaceholder.style.height = getTotalHeight() + 'px';
            }

            function createCardElement(img, globalIndex) {
                const card = document.createElement('div');
                card.className = 'image-card';
                const imageId = getImageId(img);
                card.dataset.imageId = imageId;
                card.dataset.index = globalIndex;
                
                const imgContainer = document.createElement('div');
                imgContainer.className = 'img-container';
                
                const imageEl = document.createElement('img');
                imageEl.dataset.src = imageId;
                imageEl.alt = img.name;
                imageEl.setAttribute('decoding', 'async');
                imageEl.setAttribute('loading', 'lazy');
                imageEl.style.width = '100%';
                imageEl.style.height = '100%';
                
                const placeholder = document.createElement('div');
                placeholder.className = 'img-loading-placeholder';
                imgContainer.appendChild(placeholder);
                imgContainer.appendChild(imageEl);
                
                const info = document.createElement('div');
                info.className = 'card-info';
                const folderShort = (normalizePath(img.folder || '') || '根目录').split('/').pop() || '根目录';
                info.innerHTML = `
                    <div class="file-name" title="${escapeHtml(img.name)}">${escapeHtml(img.name)}</div>
                    <div><span class="meta-tag folder">📁 ${escapeHtml(folderShort)}</span>
                    <span class="meta-tag size">📏 ${formatSize(img.size)}</span></div>
                    <div><span class="meta-tag date">🕒 ${formatDate(img.modified)}</span></div>`;
                card.appendChild(imgContainer);
                card.appendChild(info);
                return card;
            }

            function observeVisibleImages() {
                const generation = loadGeneration;
                resetStaleLoadingImages();
                
                if (loadingBatchTimer) {
                    clearTimeout(loadingBatchTimer);
                }
                loadingBatchTimers.forEach(({ timer, batch }) => {
                    clearTimeout(timer);
                    releaseScheduledBatch(batch);
                });
                loadingBatchTimers = [];
                
                const imgElements = visibleContent.querySelectorAll('img[data-src]');
                const smallImages = [];
                const largeImages = [];
                
                imgElements.forEach(img => {
                    if (!img.src && !img.classList.contains('loaded') && !img.classList.contains('error') && !img.dataset.scheduled && isInViewport(img)) {
                        const src = img.dataset.src;
                        const imgData = imageIndex.get(src);
                        if (imgData) {
                            const fileSize = imgData.size || 0;
                            if (fileSize >= CONFIG.THUMBNAIL_SIZE_THRESHOLD) {
                                largeImages.push({ element: img, data: imgData });
                            } else {
                                smallImages.push({ element: img, data: imgData });
                            }
                        }
                    }
                });
                
                smallImages.sort((a, b) => (a.data.size || 0) - (b.data.size || 0));
                
                let currentIndex = 0;
                let batchDelay = 0;
                
                while (currentIndex < smallImages.length) {
                    const currentFileSize = smallImages[currentIndex].data.size || 0;
                    const dynamicBatchSize = getBatchSize(currentFileSize);
                    
                    const batch = smallImages.slice(currentIndex, currentIndex + dynamicBatchSize);
                    
                    batch.forEach(({ element }) => {
                        markImageScheduled(element, 'small');
                    });
                    
                    loadingBatchTimer = setTimeout(() => {
                        loadBatchWithPlaceholder(batch, generation);
                    }, batchDelay);
                    loadingBatchTimers.push({ timer: loadingBatchTimer, batch });
                    
                    currentIndex += dynamicBatchSize;
                    batchDelay += CONFIG.BATCH_INTERVAL;
                }
                
                if (!isScrolling) {
                    largeImages.forEach(({ element, data }) => {
                        markImageScheduled(element, 'large');
                        loadImageWithPlaceholder(element, data, generation).catch(err => {
                            log('error', '[THUMB] Load failed:', data.name, err);
                        });
                    });
                } else {
                    if (largeImages.length > 0) {
                        log('debug', '[PAUSE] Scroll paused, skipping', largeImages.length, 'thumbnail generation tasks');
                    }
                }
            }
            
            // 分批加载图片并显示占位符
            function loadBatchWithPlaceholder(batch, generation = loadGeneration) {
                if (generation !== loadGeneration || isScrolling) {
                    releaseScheduledBatch(batch);
                    return;
                }
                
                const validBatch = batch.filter(({ element }) => isInViewport(element));
                const validElements = new Set(validBatch.map(({ element }) => element));
                batch.forEach(({ element }) => {
                    if (!validElements.has(element) && element.dataset.scheduled === 'small') {
                        resetImageLoadState(element, false);
                    }
                });
                
                if (validBatch.length === 0) {
                    releaseScheduledBatch(batch);
                    return;
                }
                
                const batchTimeout = setTimeout(() => {
                    if (generation !== loadGeneration) return;
                    console.warn('Batch loading timeout, clearing scheduled marks');
                    validBatch.forEach(({ element }) => {
                        resetImageLoadState(element, true);
                    });
                }, 15000);
                
                const promises = validBatch.map(({ element, data }) => 
                    loadImageWithPlaceholder(element, data, generation).catch(err => {
                        console.warn('Individual image load failed:', err);
                    })
                );
                
                Promise.allSettled(promises).finally(() => {
                    clearTimeout(batchTimeout);
                });
            }
            
            async function loadImageWithPlaceholder(imgElement, imgData, generation = loadGeneration, retryCount = 0) {
                if (generation !== loadGeneration) return;
                if (!imgElement.isConnected) return;
                if (imgElement.classList.contains('loaded') || imgElement.classList.contains('error')) {
                    resetImageLoadState(imgElement);
                    log('debug', '[SKIP] Already loaded or error:', imgData.name);
                    return;
                }
                
                const fileSize = imgData.size || 0;
                const isLargeImage = fileSize >= CONFIG.THUMBNAIL_SIZE_THRESHOLD;
                
                log('debug', '[LOAD] Starting load:', imgData.name, 'Size:', imgData.size || 0);
                
                try {
                    let imageUrl = await ensureImageObjectUrl(imgData);
                    if (generation !== loadGeneration) return;
                    
                    if (!imageUrl || !imageUrl.startsWith('blob:')) {
                        throw new Error('Invalid Object URL');
                    }
                    
                    if (isLargeImage) {
                        log('debug', '[THUMB] Processing large image:', imgData.name);
                        const thumbnailKey = getImageId(imgData);
                        const cachedThumbnail = thumbnailCache.get(thumbnailKey);
                        if (cachedThumbnail) {
                            log('debug', '[THUMB] Using cached thumbnail:', imgData.name);
                            imageUrl = cachedThumbnail;
                        } else {
                            log('debug', '[THUMB] Generating thumbnail via worker:', imgData.name);
                            try {
                                const thumbnailUrl = await scheduleWorkerTask(() => 
                                    atomicThumbnailTask(imageUrl)
                                );
                                if (generation !== loadGeneration) {
                                    try { URL.revokeObjectURL(thumbnailUrl); } catch (e) {}
                                    return;
                                }
                                
                                thumbnailCache.set(thumbnailKey, thumbnailUrl);
                                imageUrl = thumbnailUrl;
                                log('debug', '[THUMB] Thumbnail generated successfully:', imgData.name);
                            } catch (thumbErr) {
                                log('warn', '[THUMB] Thumbnail generation failed, falling back to original:', imgData.name, thumbErr);
                            }
                        }
                    } else {
                        log('debug', '[SMALL] Loading small image directly:', imgData.name);
                    }
                    
                    await new Promise((resolve, reject) => {
                        let timeout;
                        
                        imgElement.onload = () => {
                            clearTimeout(timeout);
                            log('info', '[OK] Image loaded successfully:', imgData.name);
                            resolve();
                        };
                        
                        imgElement.onerror = () => {
                            clearTimeout(timeout);
                            if (imgElement.complete && imgElement.naturalWidth > 0) {
                                resolve();
                            } else {
                                log('error', '[ERROR] Image load failed:', imgData.name);
                                reject(new Error('Image load failed'));
                            }
                        };
                        
                        imgElement.dataset.loadingStarted = String(Date.now());
                        imgElement.src = imageUrl;
                        
                        timeout = setTimeout(() => {
                            if (imgElement.complete && imgElement.naturalWidth > 0) {
                                resolve();
                            } else {
                                log('error', '[TIMEOUT] Load timeout:', imgData.name);
                                reject(new Error('Load timeout'));
                            }
                        }, 30000);
                    });
                    
                    if (generation !== loadGeneration) return;

                    // 加载成功
                    imgElement.classList.add('loaded');
                    resetImageLoadState(imgElement);
                    const placeholder = imgElement.parentElement.querySelector('.img-loading-placeholder');
                    if (placeholder) placeholder.remove();
                    log('debug', '[DONE] Image processing complete:', imgData.name);
                    
                } catch (err) {
                    if (generation !== loadGeneration) return;
                    log('error', '[EXCEPTION] Failed to load image:', imgData.name, err);
                    
                    resetImageLoadState(imgElement);
                    
                    imgElement.src = '';
                    imgElement.removeAttribute('src');

                    if (retryCount < 2) {
                        await new Promise(resolve => setTimeout(resolve, 300 * (retryCount + 1)));
                        return loadImageWithPlaceholder(imgElement, imgData, generation, retryCount + 1);
                    }

                    showErrorState(imgElement, '加载失败（点击重试）', () => {
                        showRetryState(imgElement);
                        observeVisibleImages();
                    });
                }
            }
            
            // 显示错误状态，支持点击重试
            function showErrorState(imgElement, message = '加载失败', onClick = null) {
                imgElement.classList.add('error');
                const container = imgElement.parentElement;
                if (!container) return;
                let placeholder = container.querySelector('.img-loading-placeholder');
                if (!placeholder) {
                    placeholder = document.createElement('div');
                    placeholder.className = 'img-loading-placeholder error';
                    container.appendChild(placeholder);
                }
                placeholder.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#999;font-size:0.8rem;cursor:pointer;padding:8px;text-align:center;" title="点击重试">${escapeHtml(message)}</div>`;
                placeholder.classList.add('error');
                if (onClick) {
                    placeholder.querySelector('div').onclick = event => {
                        event.stopPropagation();
                        onClick();
                    };
                }
            }

            function showRetryState(imgElement) {
                imgElement.classList.remove('error', 'loaded');
                resetImageLoadState(imgElement);
                const container = imgElement.parentElement;
                if (!container) return;
                const placeholder = container.querySelector('.img-loading-placeholder');
                if (placeholder) {
                    placeholder.classList.remove('error');
                    placeholder.innerHTML = '';
                } else {
                    const newPlaceholder = document.createElement('div');
                    newPlaceholder.className = 'img-loading-placeholder';
                    container.insertBefore(newPlaceholder, container.firstChild);
                }
            }
            
            function onScroll() {
                isScrolling = true;
                
                if (scrollPauseTimer) {
                    clearTimeout(scrollPauseTimer);
                }
                
                scrollPauseTimer = setTimeout(() => {
                    isScrolling = false;
                    observeVisibleImages();
                    if (workerQueue.length > 0) {
                        processWorkerQueue();
                    }
                }, CONFIG.SCROLL_STOP_DELAY);
                
                if (!ticking) {
                    requestAnimationFrame(() => {
                        renderVisibleItems();
                        ticking = false;
                    });
                    ticking = true;
                }
            }

            function updateDisplay() {
                let filtered = getFilteredImages();
                // 排序
                const [sortKey, sortOrder] = currentSort.split('-');
                filtered.sort((a, b) => {
                    let valA, valB;
                    if (sortKey === 'name') {
                        valA = a.name.toLowerCase();
                        valB = b.name.toLowerCase();
                    } else if (sortKey === 'date') {
                        valA = a.modified || 0;
                        valB = b.modified || 0;
                    } else if (sortKey === 'size') {
                        valA = a.size || 0;
                        valB = b.size || 0;
                    }
                    if (valA < valB) return sortOrder === 'asc' ? -1 : 1;
                    if (valA > valB) return sortOrder === 'asc' ? 1 : -1;
                    return 0;
                });

                currentDisplayImages = filtered;
                rebuildImageIndex();
                displayRevision++;
                statImages.textContent = filtered.length;
                
                // 优化统计计算：避免重复创建 Set，使用更高效的计算方式
                const folderSet = new Set();
                let totalSize = 0;
                for (let i = 0; i < filtered.length; i++) {
                    const img = filtered[i];
                    folderSet.add(normalizePath(img.folder || '根目录'));
                    totalSize += img.size || 0;
                }
                statFolders.textContent = folderSet.size;
                statSize.textContent = formatSize(totalSize);
                
                document.querySelectorAll('.tree-item').forEach(el => el.classList.remove('active'));
                
                //  查找并高亮激活的树节点
                // 根目录对应 data-path="__root__"（在 renderTree 中设置）
                let selector;
                if (activeFolder === '') {
                    // 空字符串表示根目录，对应 __root__
                    selector = '.tree-item[data-path="__root__"]';
                } else if (activeFolder === null) {
                    // null 表示未选择，不选中任何节点
                    selector = null;
                } else {
                    // 其他具体路径
                    const escapedPath = typeof CSS !== 'undefined' && CSS.escape ? CSS.escape(activeFolder) : activeFolder.replace(/"/g, '\\"');
                    selector = `.tree-item[data-path="${escapedPath}"]`;
                }
                
                if (selector) {
                    const activeEl = document.querySelector(selector);
                    if (activeEl) activeEl.classList.add('active');
                }
                
                updateLayoutParams();
                renderedStartIndex = -1;
                renderedEndIndex = -1;
                renderVisibleItems();
                observeVisibleImages();
            }

            function getFilteredImages() {
                return allImages.filter(imageMatchesCurrentFilters);
            }

            // ---------- 灯箱与缩放 ----------
            let currentLightboxList = [];
            let currentIndex = -1;
            let lightboxOpenToken = 0;

            async function openLightbox(idx, list){
                if(!list.length) return;
                const token = ++lightboxOpenToken;
                currentLightboxList = list;
                currentIndex = idx;
                const img = list[idx];
                let url;
                try {
                    url = await ensureImageObjectUrl(img);
                } catch (err) {
                    if (token === lightboxOpenToken) {
                        showToast('❌ 无法读取图片：' + err.message);
                    }
                    return;
                }
                if (token !== lightboxOpenToken) return;
                lightboxImg.src = url;
                lightbox.style.display = 'flex';
                lightboxPrev.style.display = list.length>1?'flex':'none';
                lightboxNext.style.display = list.length>1?'flex':'none';
                resetZoom();
            }

            function closeLightbox(){ 
                lightboxOpenToken++;
                lightbox.style.display='none'; 
                lightboxImg.src=''; 
                resetZoom();
                currentLightboxList = [];
                currentIndex = -1;
            }

            function navLightbox(dir){
                if(!currentLightboxList.length) return;
                let idx = currentIndex + dir;
                if(idx<0) idx = currentLightboxList.length-1;
                if(idx>=currentLightboxList.length) idx=0;
                openLightbox(idx, currentLightboxList);
            }

            function resetZoom() {
                currentScale = 1;
                panX = 0;
                panY = 0;
                updateTransform();
            }

            function zoomIn() {
                currentScale = Math.min(currentScale + 0.25, 5);
                updateTransform();
            }

            function zoomOut() {
                currentScale = Math.max(currentScale - 0.25, 0.25);
                // 缩小到一定程度时重置平移
                if (currentScale <= 1) {
                    panX = 0;
                    panY = 0;
                }
                updateTransform();
            }
            
            // 更新变换（缩放+平移）
            function updateTransform() {
                lightboxImgWrapper.style.transform = `translate(${panX}px, ${panY}px) scale(${currentScale})`;
            }
            
            // 开始平移
            function startPan(e) {
                if (currentScale <= 1) return; // 只有在放大时才允许平移
                isPanning = true;
                startX = e.clientX || e.touches[0].clientX;
                startY = e.clientY || e.touches[0].clientY;
                lightboxImgWrapper.style.cursor = 'grabbing';
                e.preventDefault();
            }
            
            // 平移中
            function doPan(e) {
                if (!isPanning) return;
                const clientX = e.clientX || e.touches[0].clientX;
                const clientY = e.clientY || e.touches[0].clientY;
                const deltaX = clientX - startX;
                const deltaY = clientY - startY;
                
                panX += deltaX;
                panY += deltaY;
                
                //  边界限制：防止图片移出视野
                const wrapperRect = lightboxImgWrapper.parentElement.getBoundingClientRect();
                const imgRect = lightboxImg.getBoundingClientRect();
                const maxPanX = Math.max(0, (imgRect.width * currentScale - wrapperRect.width) / 2);
                const maxPanY = Math.max(0, (imgRect.height * currentScale - wrapperRect.height) / 2);
                panX = Math.max(-maxPanX, Math.min(maxPanX, panX));
                panY = Math.max(-maxPanY, Math.min(maxPanY, panY));
                
                startX = clientX;
                startY = clientY;
                updateTransform();
                e.preventDefault();
            }
            
            // 结束平移
            function endPan() {
                isPanning = false;
                lightboxImgWrapper.style.cursor = currentScale > 1 ? 'grab' : 'default';
            }
            
            // 移动端双指缩放手势
            let initialDistance = 0;
            let initialScale = 1;
            
            function getTouchDistance(touch1, touch2) {
                const dx = touch1.clientX - touch2.clientX;
                const dy = touch1.clientY - touch2.clientY;
                return Math.sqrt(dx * dx + dy * dy);
            }
            
            // 统一的触摸事件处理（合并平移、缩放、滑动切换）
            lightboxImgWrapper.addEventListener('touchstart', (e) => {
                if (e.touches.length === 2) {
                    // 双指缩放开始
                    e.preventDefault();
                    initialDistance = getTouchDistance(e.touches[0], e.touches[1]);
                    initialScale = currentScale;
                } else if (e.touches.length === 1) {
                    if (currentScale > 1) {
                        // 放大状态：启动平移
                        startPan(e);
                    } else {
                        // 未放大：记录起始位置用于滑动切换
                        startX = e.touches[0].clientX;
                    }
                }
            }, { passive: false });
            
            lightboxImgWrapper.addEventListener('touchmove', (e) => {
                if (e.touches.length === 2) {
                    // 双指缩放中
                    e.preventDefault();
                    const currentDistance = getTouchDistance(e.touches[0], e.touches[1]);
                    //  防止除零错误：初始距离过小时忽略
                    if (initialDistance < 10) return;
                    const scale = initialScale * (currentDistance / initialDistance);
                    currentScale = Math.max(0.25, Math.min(scale, 5));
                    updateTransform();
                } else if (e.touches.length === 1 && currentScale > 1) {
                    // 放大状态：执行平移
                    doPan(e);
                } else if (e.touches.length === 1 && currentScale <= 1 && !isPanning) {
                    // 单指滑动检测（用于切换图片）
                    const deltaX = e.touches[0].clientX - startX;
                    if (Math.abs(deltaX) > CONFIG.SWIPE_THRESHOLD) {
                        // 滑动距离超过50px，触发切换
                        if (deltaX > 0) {
                            navLightbox(-1); // 向右滑，上一张
                        } else {
                            navLightbox(1); // 向左滑，下一张
