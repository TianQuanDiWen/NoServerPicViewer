<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>本地图片浏览器</title>
    <style>
        :root {
            --bg: #f5f5f7;
            --card-bg: #ffffff;
            --text: #1d1d1f;
            --text-secondary: #6e6e73;
            --border: #e5e5ea;
            --accent: #0071e3;
            --accent-hover: #0077ed;
            --shadow: 0 2px 12px rgba(0,0,0,0.08);
            --shadow-hover: 0 8px 30px rgba(0,0,0,0.14);
            --tag-bg: #f0f0f5;
            --badge-folder: #f0f4ff; --badge-folder-text: #3b5ccc;
            --badge-size: #f0faf5; --badge-size-text: #2d8a56;
            --badge-date: #fdf6f0; --badge-date-text: #b87a3a;
            --sidebar-bg: #fafafa;
            --sidebar-width: 260px;
        }
        @media (prefers-color-scheme: dark) {
            :root { --bg: #1c1c1e; --card-bg: #2c2c2e; --text: #f5f5f7; --text-secondary: #a1a1a6; --border: #3a3a3c; --accent: #4da6ff; --tag-bg: #3a3a3c; --badge-folder: #1e2a45; --badge-folder-text: #8aadff; --badge-size: #1a3028; --badge-size-text: #5ec48a; --badge-date: #2e2418; --badge-date-text: #d4a05a; --sidebar-bg: #252528; }
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        html, body { height: 100%; overflow: hidden; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; background: var(--bg); color: var(--text); display:flex; }
        .sidebar {
            width: var(--sidebar-width); min-width: var(--sidebar-width);
            background: var(--sidebar-bg); border-right: 1px solid var(--border);
            display: flex; flex-direction: column; height: 100%;
            overflow-y: auto; overflow-x: hidden;
            z-index: 50; transition: transform 0.3s;
        }
        .sidebar-header { padding: 14px 16px; font-weight: 700; font-size: 1rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
        .tree-container { flex: 1; padding: 8px 0; overflow-y: auto; }
        .tree-item {
            display: flex; align-items: center; padding: 4px 12px; cursor: pointer;
            font-size: 0.88rem; border-radius: 6px; margin: 1px 6px; transition: background 0.15s;
            white-space: nowrap; user-select: none;
        }
        .tree-item:hover { background: var(--tag-bg); }
        .tree-item.active { background: var(--accent); color: #fff; }
        .tree-item .folder-icon { font-size: 1rem; margin-right: 4px; flex-shrink: 0; }
        .tree-item .folder-name { overflow: hidden; text-overflow: ellipsis; flex:1; min-width:0; }
        .tree-item .count { font-size: 0.7rem; opacity: 0.7; margin-left: 4px; }
        .tree-children { padding-left: 12px; }
        .tree-toggle { width: 16px; height: 16px; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; margin-right: 2px; font-size: 0.7rem; }
        .tree-toggle.collapsed::before { content: '▶'; }
        .tree-toggle.expanded::before { content: '▼'; }
        .main-area { flex: 1; display: flex; flex-direction: column; height: 100%; min-width: 0; }
        .navbar {
            background: var(--card-bg);
            border-bottom:1px solid var(--border); padding:8px 16px;
            display:flex; align-items:center; gap:8px; flex-wrap:wrap;
            box-shadow:0 1px 4px rgba(0,0,0,0.04);
            flex-shrink: 0;
        }
        .logo { font-weight:700; font-size:1rem; white-space:nowrap; display:flex; align-items:center; gap:4px; }
        .btn { padding:5px 12px; border-radius:8px; border:1px solid var(--border); background:var(--card-bg); color:var(--text); cursor:pointer; font-size:0.78rem; font-weight:500; display:inline-flex; align-items:center; gap:4px; transition:all 0.2s; white-space:nowrap; }
        .btn:hover { background:var(--tag-bg); }
        .btn.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
        .btn.primary:hover { background:var(--accent-hover); }
        .search-wrapper { flex:1 1 auto; min-width:140px; max-width:280px; position:relative; }
        .search-wrapper input { width:100%; padding:5px 10px 5px 30px; border-radius:20px; border:1.5px solid var(--border); background:var(--bg); color:var(--text); outline:none; font-size:0.8rem; }
        .search-wrapper input:focus { border-color:var(--accent); }
        .search-icon { position:absolute; left:10px; top:50%; transform:translateY(-50%); font-size:0.75rem; opacity:0.5; pointer-events:none; }
        #sortSelect, #filterDateStart, #filterDateEnd {
            padding:4px 8px; border-radius:6px; border:1px solid var(--border);
            background:var(--bg); color:var(--text); font-size:0.75rem; white-space:nowrap;
        }
        .stats { display:flex; gap:5px; }
        .stat { font-size:0.7rem; padding:2px 6px; border-radius:10px; background:var(--tag-bg); }
        .current-folder-badge {
            background: var(--accent); color: #fff; padding: 3px 10px; border-radius: 12px;
            font-size: 0.75rem; font-weight: 500; margin: 0 4px; white-space: nowrap;
            overflow: hidden; text-overflow: ellipsis; max-width: 200px;
        }
        .scroll-container {
            flex:1; overflow-y:auto; overflow-x:hidden; position:relative;
            -webkit-overflow-scrolling: touch;
        }
        .scroll-placeholder { position:relative; width:100%; }
        .visible-content { position:absolute; top:0; left:0; width:100%; pointer-events:none; }
        .visible-content > * { pointer-events:auto; }
        .image-card {
            background:var(--card-bg); border-radius:12px; overflow:hidden;
            border:1px solid var(--border); box-shadow:var(--shadow); cursor:pointer;
            transition:transform 0.2s, box-shadow 0.2s; display:flex; flex-direction:column;
            position:absolute;
        }
        .image-card:hover { transform:translateY(-3px); box-shadow:var(--shadow-hover); }
        .img-container {
            width:100%; aspect-ratio:4/3; background:#e0e0e5;
            position:relative; overflow:hidden;
        }
        .img-container img {
            width:100%; height:100%; object-fit:cover; display:block;
            opacity:0; transition: opacity 0.3s;
        }
        .img-container img.loaded { opacity:1; }
        
        /* 图片加载动画 */
        .img-loading-placeholder {
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: loading-shimmer 1.5s infinite;
        }
        
        @keyframes loading-shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        
        @media (prefers-color-scheme: dark) {
            .img-loading-placeholder {
                background: linear-gradient(90deg, #3a3a3c 25%, #2c2c2e 50%, #3a3a3c 75%);
                background-size: 200% 100%;
            }
        }
        
        .card-info { padding:6px 10px 10px; display:flex; flex-direction:column; gap:3px; }
        .file-name { font-weight:600; font-size:0.78rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .meta-tag { font-size:0.65rem; padding:2px 5px; border-radius:4px; display:inline-flex; align-items:center; gap:2px; }
        .meta-tag.folder { background:var(--badge-folder); color:var(--badge-folder-text); max-width:130px; overflow:hidden; text-overflow:ellipsis; }
        .meta-tag.size { background:var(--badge-size); color:var(--badge-size-text); }
        .meta-tag.date { background:var(--badge-date); color:var(--badge-date-text); }

        /* 灯箱 */
        .lightbox {
            position:fixed; inset:0; z-index:1000; background:rgba(0,0,0,0.9);
            display:flex; flex-direction:column; align-items:center; justify-content:center;
        }
        .lightbox-img-wrapper {
            max-width:92vw; max-height:85vh; display:flex; align-items:center; justify-content:center;
            transition: transform 0.1s ease-out; overflow: hidden;
        }
        .lightbox-img-wrapper img {
            max-width:100%; max-height:85vh; border-radius:8px; object-fit:contain;
            transition: transform 0.1s ease-out;
        }
        .lightbox .close, .lightbox .nav {
            position:fixed; background:rgba(255,255,255,0.2); border:none; color:#fff;
            font-size:1.4rem; width:40px; height:40px; border-radius:50%; cursor:pointer;
            display:flex; align-items:center; justify-content:center; z-index:1010;
        }
        .lightbox .close { top:16px; right:16px; }
        .lightbox .nav.prev { left:12px; top:50%; transform:translateY(-50%); }
        .lightbox .nav.next { right:12px; top:50%; transform:translateY(-50%); }
        .lightbox-controls {
            position:fixed; bottom:20px; display:flex; gap:10px; z-index:1010;
            background:rgba(0,0,0,0.5); padding:6px 16px; border-radius:30px;
        }
        .lightbox-controls .btn {
            background:rgba(255,255,255,0.2); color:#fff; border:none; font-size:0.8rem;
            padding:5px 12px; border-radius:20px; cursor:pointer;
        }
        .toast {
            position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(100px);
            background:#333; color:#fff; padding:8px 20px; border-radius:20px; font-size:0.85rem;
            z-index:2000; transition:0.3s;
        }
        .toast.show { transform:translateX(-50%) translateY(0); }

        @media (max-width: 768px) {
            .sidebar { position: fixed; left:0; top:0; height:100%; transform: translateX(-100%); z-index: 200; }
            .sidebar.open { transform: translateX(0); box-shadow: 4px 0 20px rgba(0,0,0,0.3); }
            .sidebar-toggle { display: inline-flex !important; }
            .main-area { width: 100%; }
        }
        .sidebar-toggle { display: none; background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 5px 8px; cursor: pointer; font-size: 1.1rem; }
    </style>
</head>
<body>
    <div id="sidebarOverlay" style="position:fixed;inset:0;background:rgba(0,0,0,0.3);z-index:199;display:none;" onclick="toggleSidebar()"></div>

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header"><span>📁 文件夹</span></div>
        <div class="tree-container" id="treeContainer"></div>
    </aside>

    <div class="main-area">
        <nav class="navbar">
            <button class="btn sidebar-toggle" id="sidebarToggleBtn" onclick="toggleSidebar()" style="display:none;">☰</button>
            <span class="logo">🖼️ 图片浏览器</span>
            <button class="btn primary" id="selectFolderBtn">📂 选择本地文件夹</button>
            <div class="search-wrapper">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" placeholder="搜索图片名称...">
            </div>
            <div class="stats">
                <span class="stat">📷 <span id="statImages">0</span></span>
                <span class="stat">📁 <span id="statFolders">0</span></span>
                <span class="stat">💾 <span id="statSize">0 B</span></span>
            </div>
            <span class="current-folder-badge" id="currentFolderBadge" style="display:none;"></span>
            <select id="sortSelect">
                <option value="date-desc" selected>时间 ↓</option>
                <option value="date-asc">时间 ↑</option>
                <option value="name-asc">名称 ↑</option>
                <option value="name-desc">名称 ↓</option>
                <option value="size-desc">大小 ↓</option>
                <option value="size-asc">大小 ↑</option>
            </select>
            <input type="date" id="filterDateStart" title="开始日期">
            <input type="date" id="filterDateEnd" title="结束日期">
            <button class="btn" id="applyFilterBtn">筛选</button>
            <button class="btn" id="clearFilterBtn">清除</button>
        </nav>
        
        <div class="scroll-container" id="scrollContainer">
            <div class="scroll-placeholder" id="scrollPlaceholder"></div>
            <div class="visible-content" id="visibleContent"></div>
        </div>
    </div>

    <div class="lightbox" id="lightbox" style="display:none;">
        <button class="close" id="lightboxClose">✕</button>
        <button class="nav prev" id="lightboxPrev">◀</button>
        <button class="nav next" id="lightboxNext">▶</button>
        <div class="lightbox-img-wrapper" id="lightboxImgWrapper">
            <img id="lightboxImg" src="" alt="">
        </div>
        <div class="lightbox-controls">
            <button class="btn" id="lightboxZoomIn">🔍+</button>
            <button class="btn" id="lightboxZoomOut">🔍-</button>
            <button class="btn" id="lightboxReset">↺ 原始</button>
            <button class="btn" id="lightboxFullscreen">⛶ 全屏</button>
            <button class="btn" id="lightboxCopy">📋 复制图片</button>
        </div>
    </div>
    <div class="toast" id="toast"></div>
    
    <!-- 加载状态指示器 -->
    <div id="loadingOverlay" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:3000; align-items:center; justify-content:center; flex-direction:column; color:#fff;">
        <div style="font-size:2rem; margin-bottom:16px;">⏳</div>
        <div id="loadingText" style="font-size:1.1rem; margin-bottom:8px;">正在扫描文件夹...</div>
        <div id="loadingProgress" style="font-size:0.9rem; opacity:0.8;">已发现 0 张图片</div>
    </div>

    <script>
        (() => {
            const treeContainer = document.getElementById('treeContainer');
            const searchInput = document.getElementById('searchInput');
            const statImages = document.getElementById('statImages');
            const statFolders = document.getElementById('statFolders');
            const statSize = document.getElementById('statSize');
            const selectFolderBtn = document.getElementById('selectFolderBtn');
            const lightbox = document.getElementById('lightbox');
            const lightboxImg = document.getElementById('lightboxImg');
            const lightboxImgWrapper = document.getElementById('lightboxImgWrapper');
            const lightboxClose = document.getElementById('lightboxClose');
            const lightboxPrev = document.getElementById('lightboxPrev');
            const lightboxNext = document.getElementById('lightboxNext');
            const lightboxZoomIn = document.getElementById('lightboxZoomIn');
            const lightboxZoomOut = document.getElementById('lightboxZoomOut');
            const lightboxReset = document.getElementById('lightboxReset');
            const lightboxFullscreen = document.getElementById('lightboxFullscreen');
            const lightboxCopy = document.getElementById('lightboxCopy');
            const toast = document.getElementById('toast');
            const currentFolderBadge = document.getElementById('currentFolderBadge');
            const scrollContainer = document.getElementById('scrollContainer');
            const scrollPlaceholder = document.getElementById('scrollPlaceholder');
            const visibleContent = document.getElementById('visibleContent');
            
            // 加载状态指示器
            const loadingOverlay = document.getElementById('loadingOverlay');
            const loadingText = document.getElementById('loadingText');
            const loadingProgress = document.getElementById('loadingProgress');

            const sortSelect = document.getElementById('sortSelect');
            const filterDateStart = document.getElementById('filterDateStart');
            const filterDateEnd = document.getElementById('filterDateEnd');
            const applyFilterBtn = document.getElementById('applyFilterBtn');
            const clearFilterBtn = document.getElementById('clearFilterBtn');

            let allImages = [];
            let folderTree = null;
            let activeFolder = null;
            let currentRootFolder = ''; //  存储用户选择的根文件夹名称
            let currentDisplayImages = [];
            const imageExtensions = new Set(['jpg','jpeg','png','gif','webp','bmp','svg','tiff','tif','avif','ico','heic','heif','jfif']);
            
            let rowHeight = 260;
            let columnCount = 4;
            let containerWidth = 0;
            let gap = 12;
            
            let loadingBatchTimer = null;
            let isScrolling = false;
            let scrollPauseTimer = null;
            
            let renderedStartIndex = 0;
            let renderedEndIndex = 0;
            let resizeObserver = null;
            let ticking = false;
            let currentScale = 1;
            let currentSort = 'date-desc';
            
            let panX = 0;
            let panY = 0;
            let isPanning = false;
            let startX = 0;
            let startY = 0;
            
            let searchDebounceTimer = null;
            let objectUrlSet = new Set();

            const CONFIG = {
                VIEWPORT_BUFFER: 200,
                ROW_OVERSCAN: 3,
                SCROLL_PAUSE_THRESHOLD: 500 * 1024,
                SCROLL_STOP_DELAY: 50,
                SWIPE_THRESHOLD: 50,
                SEARCH_DEBOUNCE: 300,
                MIN_BATCH: 1,
                MAX_BATCH: 20,
                HALF_SIZE: 1 * 1024 * 1024,
                BATCH_INTERVAL: 100,
                THUMBNAIL_SIZE_THRESHOLD: 500 * 1024,
                THUMBNAIL_MAX_WIDTH: 400,
                THUMBNAIL_MAX_HEIGHT: 300,
                THUMBNAIL_QUALITY: 0.8,
                LRU_CACHE_MAX_SIZE: 200,
            };

            class ThumbnailLRUCache {
                constructor(maxSize) {
                    this.maxSize = maxSize;
                    this.cache = new Map();
                }
                
                get(imageUrl) {
                    if (!this.cache.has(imageUrl)) return null;
                    const item = this.cache.get(imageUrl);
                    item.lastAccess = Date.now();
                    return item.blobUrl;
                }
                
                set(imageUrl, blobUrl) {
                    if (this.cache.has(imageUrl)) {
                        this.cache.delete(imageUrl);
                    }
                    this.cache.set(imageUrl, { blobUrl, lastAccess: Date.now() });
                    if (this.cache.size > this.maxSize) this.evict();
                }
                
                has(imageUrl) { return this.cache.has(imageUrl); }
                
                delete(imageUrl) {
                    if (this.cache.has(imageUrl)) {
                        const item = this.cache.get(imageUrl);
                        try { URL.revokeObjectURL(item.blobUrl); } catch (e) {}
                        this.cache.delete(imageUrl);
                    }
                }
                
                clear() {
                    for (const [, item] of this.cache) {
                        try { URL.revokeObjectURL(item.blobUrl); } catch (e) {}
                    }
                    this.cache.clear();
                }
                
                evict() {
                    let oldestKey = null, oldestTime = Infinity;
                    for (const [key, item] of this.cache) {
                        if (item.lastAccess < oldestTime) {
                            oldestTime = item.lastAccess;
                            oldestKey = key;
                        }
                    }
                    if (oldestKey) this.delete(oldestKey);
                }
                
                get size() { return this.cache.size; }
            }

            const thumbnailCache = new ThumbnailLRUCache(CONFIG.LRU_CACHE_MAX_SIZE);

            function formatSize(bytes) {
                if (!bytes) return '0 B';
                const u = ['B','KB','MB','GB']; let i=0;
                while(bytes>=1024 && i<3){bytes/=1024;i++;}
                return bytes.toFixed(i?1:0)+' '+u[i];
            }
            
            // 统一的 Object URL 清理函数
            function cleanupObjectUrls() {
                objectUrlSet.forEach(url => {
                    try {
                        URL.revokeObjectURL(url);
                    } catch (e) {
                        console.warn('Failed to revoke URL:', e);
                    }
                });
                objectUrlSet.clear();
                
                //  同时清理所有 img 元素的 src，防止引用已释放的 URL
                const allImages = document.querySelectorAll('.image-card img');
                allImages.forEach(img => {
                    if (img.src && img.src.startsWith('blob:')) {
                        img.src = '';
                    }
                });
            }

            let thumbnailQueue = [];
            let isGeneratingThumbnail = false;

            async function generateThumbnail(imageUrl, maxWidth, maxHeight) {
                return new Promise((resolve, reject) => {
                    const img = new Image();
                    img.onload = async () => {
                        try {
                            const scale = Math.min(maxWidth / img.width, maxHeight / img.height, 1);
                            const width = Math.floor(img.width * scale);
                            const height = Math.floor(img.height * scale);
                            
                            const bitmap = await createImageBitmap(img, 0, 0, img.width, img.height, {
                                resizeWidth: width,
                                resizeHeight: height,
                                resizeQuality: 'medium'
                            });
                            
                            const canvas = document.createElement('canvas');
                            canvas.width = width;
                            canvas.height = height;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(bitmap, 0, 0);
                            bitmap.close();
                            
                            canvas.toBlob((blob) => {
                                if (blob) {
                                    resolve(URL.createObjectURL(blob));
                                } else {
                                    reject(new Error('Failed to create blob'));
                                }
                            }, 'image/jpeg', CONFIG.THUMBNAIL_QUALITY);
                        } catch (err) {
                            reject(err);
                        }
                    };
                    img.onerror = () => reject(new Error('Failed to load image'));
                    img.src = imageUrl;
                });
            }

            async function processThumbnailQueue() {
                if (isGeneratingThumbnail || thumbnailQueue.length === 0 || isScrolling) return;
                
                isGeneratingThumbnail = true;
                const task = thumbnailQueue.shift();
                
                try {
                    const blobUrl = await generateThumbnail(task.imageUrl, CONFIG.THUMBNAIL_MAX_WIDTH, CONFIG.THUMBNAIL_MAX_HEIGHT);
                    thumbnailCache.set(task.imageUrl, blobUrl);
                    task.resolve(blobUrl);
                } catch (err) {
                    console.error('Thumbnail generation failed:', err);
                    task.reject(err);
                } finally {
                    isGeneratingThumbnail = false;
                    if (!isScrolling && thumbnailQueue.length > 0) {
                        setTimeout(processThumbnailQueue, 50);
                    }
                }
            }

            function enqueueThumbnailGeneration(imageUrl) {
                return new Promise((resolve, reject) => {
                    thumbnailQueue.push({ imageUrl, resolve, reject });
                    processThumbnailQueue();
                });
            }
            
            // 全局资源清理函数
            function cleanupAllResources() {
                // 清理分批加载定时器
                if (loadingBatchTimer) {
                    clearTimeout(loadingBatchTimer);
                    loadingBatchTimer = null;
                }
                
                // 清理滚动相关定时器
                if (scrollPauseTimer) {
                    clearTimeout(scrollPauseTimer);
                    scrollPauseTimer = null;
                }
                
                //  清理搜索防抖定时器
                if (searchDebounceTimer) {
                    clearTimeout(searchDebounceTimer);
                    searchDebounceTimer = null;
                }
                
                //  清理 resize 防抖定时器
                if (resizeDebounceTimer) {
                    clearTimeout(resizeDebounceTimer);
                    resizeDebounceTimer = null;
                }
                
                // 重置滚动状态
                isScrolling = false;
                
                // 清理所有 Object URL
                cleanupObjectUrls();
                
                // 清理缩略图缓存和队列
                thumbnailCache.clear();
                thumbnailQueue = [];
                isGeneratingThumbnail = false;
                
                // 断开 ResizeObserver
                if (resizeObserver) {
                    resizeObserver.disconnect();
                    resizeObserver = null;
                }
                
                //  断开 IntersectionObserver
                if (lazyObserver) {
                    lazyObserver.disconnect();
                    lazyObserver = null;
                }
                
                console.log('All resources cleaned up');
            }
            
            // 加载状态控制函数
            function showLoading(text = '正在扫描文件夹...', progress = '') {
                loadingText.textContent = text;
                loadingProgress.textContent = progress;
                loadingOverlay.style.display = 'flex';
            }
            
            function hideLoading() {
                loadingOverlay.style.display = 'none';
            }
            
            // 动态批次大小计算（指数衰减策略）
            function getBatchSize(fileSize) {
                return Math.max(CONFIG.MIN_BATCH, Math.round(CONFIG.MAX_BATCH * Math.exp(-fileSize / CONFIG.HALF_SIZE)));
            }

            function formatDate(ms) {
                if(!ms) return '';
                const d=new Date(ms);
                return d.getFullYear()+'-'+(d.getMonth()+1).toString().padStart(2,'0')+'-'+d.getDate().toString().padStart(2,'0');
            }
            function escapeHtml(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
            
            function showErrorPlaceholder(imgElement, placeholder) {
                if (placeholder) {
                    placeholder.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#999;font-size:0.8rem;">⚠️ 加载失败</div>';
                    placeholder.classList.add('error');
                }
                imgElement.style.display = 'none';
            }
            
            function isInViewport(imgElement) {
                const rect = imgElement.getBoundingClientRect();
                const viewHeight = window.innerHeight || document.documentElement.clientHeight;
                return rect.top >= -CONFIG.VIEWPORT_BUFFER && rect.bottom <= viewHeight + CONFIG.VIEWPORT_BUFFER;
            }

            function showToast(msg){
                toast.textContent=msg; toast.classList.add('show');
                clearTimeout(window._toastTimer);
                window._toastTimer = setTimeout(()=>toast.classList.remove('show'),2000);
            }
            function normalizePath(p) {
                if (!p) return '';
                return p.replace(/\\/g, '/').trim().replace(/\/+$/, '');
            }

            window.toggleSidebar = function() {
                const sidebar = document.getElementById('sidebar');
                const overlay = document.getElementById('sidebarOverlay');
                if (sidebar.classList.contains('open')) {
                    sidebar.classList.remove('open');
                    overlay.style.display = 'none';
                } else {
                    sidebar.classList.add('open');
                    overlay.style.display = 'block';
                }
            };

            function buildFolderTree(images, rootFolderName = '') {
                //  使用空路径作为根，直接使用用户选择的文件夹名称
                const root = { name: rootFolderName || '根目录', path: '', children: {}, images: [], totalImages: 0 };
                images.forEach(img => {
                    const folder = normalizePath(img.folder || '');
                    if (!folder) {
                        root.images.push(img);
                        root.totalImages++;
                        return;
                    }
                    const parts = folder.split('/');
                    let node = root;
                    parts.forEach((part, idx) => {
                        const currentPath = parts.slice(0, idx+1).join('/');
                        if (!node.children[part]) {
                            node.children[part] = {
                                name: part,
                                path: currentPath,
                                children: {},
                                images: [],
                                totalImages: 0
                            };
                        }
                        node = node.children[part];
                        node.totalImages++;
                    });
                    node.images.push(img);
                });
                return root;
            }

            function renderTree() {
                treeContainer.innerHTML = '';
                if (!folderTree) {
                    treeContainer.innerHTML = '<div style="padding:20px;color:var(--text-secondary);">暂无文件夹</div>';
                    return;
                }
                function createTreeNode(node, level = 0) {
                    const hasChildren = Object.keys(node.children).length > 0;
                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'tree-item';
                    //  根节点使用空字符串，其他节点使用实际路径
                    itemDiv.dataset.path = node.path === '' ? '__root__' : node.path;
                    if (activeFolder === node.path) itemDiv.classList.add('active');
                    //  根节点不添加额外缩进
                    if (level > 0) itemDiv.style.paddingLeft = (12 + level * 14) + 'px';
                    const toggleSpan = document.createElement('span');
                    toggleSpan.className = 'tree-toggle';
                    if (hasChildren) {
                        toggleSpan.classList.add('expanded');
                        toggleSpan.onclick = (e) => {
                            e.stopPropagation();
                            const childrenDiv = itemDiv.nextElementSibling;
                            if (childrenDiv && childrenDiv.classList.contains('tree-children')) {
                                if (childrenDiv.style.display === 'none') {
                                    childrenDiv.style.display = 'block';
                                    toggleSpan.classList.remove('collapsed');
                                    toggleSpan.classList.add('expanded');
                                } else {
                                    childrenDiv.style.display = 'none';
                                    toggleSpan.classList.remove('expanded');
                                    toggleSpan.classList.add('collapsed');
                                }
                            }
                        };
                    }
                    itemDiv.appendChild(toggleSpan);
                    const icon = document.createElement('span');
                    icon.className = 'folder-icon';
                    //  根节点显示为打开的文件夹图标
                    icon.textContent = node.path === '' ? '📂' : '📁';
                    itemDiv.appendChild(icon);
                    const nameSpan = document.createElement('span');
                    nameSpan.className = 'folder-name';
                    //  直接使用节点名称（根节点为用户选择的文件夹名）
                    nameSpan.textContent = node.name;
                    itemDiv.appendChild(nameSpan);
                    const countSpan = document.createElement('span');
                    countSpan.className = 'count';
                    countSpan.textContent = node.totalImages;
                    itemDiv.appendChild(countSpan);
                    itemDiv.onclick = (e) => {
                        if (hasChildren) {
                            const childrenDiv = itemDiv.nextElementSibling;
                            if (childrenDiv && childrenDiv.style.display === 'none') {
                                childrenDiv.style.display = 'block';
                                toggleSpan.classList.remove('collapsed');
                                toggleSpan.classList.add('expanded');
                            }
                        }
                        setActiveFolder(node.path);
                    };
                    return itemDiv;
                }
                function renderChildren(container, node, level) {
                    const itemDiv = createTreeNode(node, level);
                    container.appendChild(itemDiv);
                    if (Object.keys(node.children).length > 0) {
                        const childrenDiv = document.createElement('div');
                        childrenDiv.className = 'tree-children';
                        Object.values(node.children).forEach(child => renderChildren(childrenDiv, child, level + 1));
                        container.appendChild(childrenDiv);
                    }
                }
                //  直接渲染根节点及其子节点，不再分离
                renderChildren(treeContainer, folderTree, 0);
            }

            function setActiveFolder(path) {
                //  空字符串表示根目录，null 表示未选择
                const normalized = path === null ? null : normalizePath(path || '');
                activeFolder = normalized;
                searchInput.value = '';
                scrollContainer.scrollTop = 0;
                updateDisplay();
                if (window.innerWidth <= 768) {
                    document.getElementById('sidebar').classList.remove('open');
                    document.getElementById('sidebarOverlay').style.display = 'none';
                }
            }

            function imageBelongsToFolder(img, folderPath) {
                //  空字符串表示根目录（用户选择的文件夹），显示所有图片
                if (folderPath === '') return true;
                const imgFolder = normalizePath(img.folder || '');
                // 精确匹配或子文件夹匹配
                return imgFolder === folderPath || imgFolder.startsWith(folderPath + '/');
            }

            function measureRowHeight() {
                const tempCard = createCardElement({ url: '', name: '测量用', folder: '测试', size: 1024, modified: Date.now() }, 0);
                tempCard.style.position = 'fixed';
                tempCard.style.visibility = 'hidden';
                tempCard.style.left = '0';
                tempCard.style.top = '0';
                const colWidth = (containerWidth - gap * (columnCount - 1)) / columnCount;
                tempCard.style.width = colWidth + 'px';
                document.body.appendChild(tempCard);
                const height = tempCard.getBoundingClientRect().height;
                document.body.removeChild(tempCard);
                return height || 260;
            }

            function updateLayoutParams() {
                const oldWidth = containerWidth;
                containerWidth = scrollContainer.clientWidth;
                if (containerWidth <= 0) return;
                const minColWidth = 180;
                columnCount = Math.max(1, Math.floor((containerWidth + gap) / (minColWidth + gap)));
                if (containerWidth !== oldWidth || rowHeight === 260) {
                    rowHeight = measureRowHeight();
                }
            }

            function getTotalHeight() {
                if (currentDisplayImages.length === 0) return 0;
                const rows = Math.ceil(currentDisplayImages.length / columnCount);
                return rows * rowHeight + (rows - 1) * gap;
            }

            function renderVisibleItems() {
                if (!scrollContainer || currentDisplayImages.length === 0) {
                    Array.from(visibleContent.children).forEach(card => card.remove());
                    scrollPlaceholder.style.height = '0px';
                    return;
                }
                
                const scrollTop = scrollContainer.scrollTop;
                const viewHeight = scrollContainer.clientHeight;
                const totalItems = currentDisplayImages.length;
                const startRow = Math.max(0, Math.floor(scrollTop / (rowHeight + gap)) - CONFIG.ROW_OVERSCAN);
                const endRow = Math.min(Math.ceil(totalItems / columnCount), Math.ceil((scrollTop + viewHeight) / (rowHeight + gap)) + CONFIG.ROW_OVERSCAN);
                const startIndex = startRow * columnCount;
                const endIndex = Math.min(totalItems, endRow * columnCount);
                
                if (startIndex === renderedStartIndex && endIndex === renderedEndIndex) return;
                renderedStartIndex = startIndex;
                renderedEndIndex = endIndex;
                
                const existingCards = Array.from(visibleContent.children);
                const existingMap = new Map();
                existingCards.forEach(card => existingMap.set(card.dataset.imageId, card));
                
                const newVisibleIds = new Set();
                const colWidth = (containerWidth - gap * (columnCount - 1)) / columnCount;
                
                for (let i = startIndex; i < endIndex; i++) {
                    const img = currentDisplayImages[i];
                    const imageId = img.url;
                    newVisibleIds.add(imageId);
                    
                    let card = existingMap.get(imageId);
                    const row = Math.floor(i / columnCount);
                    const col = i % columnCount;
                    const left = col * (colWidth + gap);
                    const top = row * (rowHeight + gap);
                    
                    if (!card) {
                        card = createCardElement(img, i);
                        card.style.width = colWidth + 'px';
                        card.style.left = left + 'px';
                        card.style.top = top + 'px';
                        visibleContent.appendChild(card);
                    } else {
                        card.style.display = '';
                        card.style.left = left + 'px';
                        card.style.top = top + 'px';
                        card.dataset.index = i;
                    }
                }
                
                existingCards.forEach(card => {
                    if (!newVisibleIds.has(card.dataset.imageId)) {
                        card.style.display = 'none';
                    }
                });
                
                scrollPlaceholder.style.height = getTotalHeight() + 'px';
            }

            function createCardElement(img, globalIndex) {
                const card = document.createElement('div');
                card.className = 'image-card';
                card.dataset.imageId = img.url;
                card.dataset.index = globalIndex;
                
                const imgContainer = document.createElement('div');
                imgContainer.className = 'img-container';
                
                const imageEl = document.createElement('img');
                imageEl.dataset.src = img.url;
                imageEl.alt = img.name;
                imageEl.setAttribute('decoding', 'async');
                imageEl.setAttribute('loading', 'lazy');
                imageEl.style.width = '100%';
                imageEl.style.height = '100%';
                
                const placeholder = document.createElement('div');
                placeholder.className = 'img-loading-placeholder';
                imgContainer.appendChild(placeholder);
                imgContainer.appendChild(imageEl);
                
                const info = document.createElement('div');
                info.className = 'card-info';
                const folderShort = (normalizePath(img.folder || '') || '根目录').split('/').pop() || '根目录';
                info.innerHTML = `
                    <div class="file-name" title="${escapeHtml(img.name)}">${escapeHtml(img.name)}</div>
                    <div><span class="meta-tag folder">📁 ${escapeHtml(folderShort)}</span>
                    <span class="meta-tag size">📏 ${formatSize(img.size)}</span></div>
                    <div><span class="meta-tag date">🕒 ${formatDate(img.modified)}</span></div>`;
                card.appendChild(imgContainer);
                card.appendChild(info);
                card.addEventListener('click', () => {
                    openLightbox(globalIndex, currentDisplayImages);
                });
                return card;
            }

            let lazyObserver = null;
            function initLazyObserver() {
                // 先断开旧实例，防止实例累积
                if (lazyObserver) {
                    lazyObserver.disconnect();
                }
                
                //  修改：IntersectionObserver 仅用于可见性检测，不直接触发加载
                // 所有加载统一由 loadImageWithPlaceholder 控制，避免重复加载
                lazyObserver = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            const img = entry.target;
                            // 仅标记为可见，不直接设置 src
                            // 实际加载由 observeVisibleImages 中的分批调度控制
                            img.dataset.visible = 'true';
                        } else {
                            const img = entry.target;
                            delete img.dataset.visible;
                        }
                    });
                }, { root: scrollContainer, rootMargin: '200px', threshold: 0.01 });
                
                // 保存实例引用以便后续清理
                lazyObserverInstance = lazyObserver;
            }

            function observeVisibleImages() {
                if (!lazyObserver) initLazyObserver();
                
                // 清除之前的分批加载定时器
                if (loadingBatchTimer) {
                    clearTimeout(loadingBatchTimer);
                }
                
                // 收集当前可见区域未加载的图片元素及其数据
                const imgElements = visibleContent.querySelectorAll('img[data-src]');
                const pendingImages = [];
                
                imgElements.forEach(img => {
                    //  只处理尚未加载、未调度、无错误且在视口内的图片
                    if (!img.src && !img.classList.contains('loaded') && !img.classList.contains('error') && !img.dataset.scheduled && isInViewport(img)) {
                        const src = img.dataset.src;
                        // 从 currentDisplayImages 中找到对应的图片数据
                        const imgData = currentDisplayImages.find(item => item.url === src);
                        if (imgData) {
                            pendingImages.push({
                                element: img,
                                data: imgData
                            });
                        }
                    }
                });
                
                // 按文件大小升序排序（小文件优先加载）
                pendingImages.sort((a, b) => (a.data.size || 0) - (b.data.size || 0));
                
                // 分批调度加载 - 使用动态批次大小 + 智能暂停策略
                let currentIndex = 0;
                let batchDelay = 0;
                
                while (currentIndex < pendingImages.length) {
                    const currentFileSize = pendingImages[currentIndex].data.size || 0;
                    
                    // 🎯 智能暂停：滚动中且是大图时跳过该批次及后续所有批次
                    if (isScrolling && currentFileSize >= CONFIG.SCROLL_PAUSE_THRESHOLD) break;

                    const dynamicBatchSize = getBatchSize(currentFileSize);
                    
                    // 提取当前批次
                    const batch = pendingImages.slice(currentIndex, currentIndex + dynamicBatchSize);
                    
                    //  标记已调度，防止重复加载
                    batch.forEach(({ element }) => {
                        element.dataset.scheduled = 'true';
                    });
                    
                    // 调度当前批次加载
                    loadingBatchTimer = setTimeout(() => {
                        loadBatchWithPlaceholder(batch);
                    }, batchDelay);
                    
                    // 更新索引和延迟时间
                    currentIndex += dynamicBatchSize;
                    batchDelay += CONFIG.BATCH_INTERVAL;

                }
            }
            
            // 分批加载图片并显示占位符
            function loadBatchWithPlaceholder(batch) {
                if (isScrolling) return;
                
                const validBatch = batch.filter(({ element }) => isInViewport(element));
                
                if (validBatch.length === 0) return;
                
                //  为批次添加超时保护，防止永久挂起
                const batchTimeout = setTimeout(() => {
                    console.warn('Batch loading timeout, clearing scheduled marks');
                    validBatch.forEach(({ element }) => {
                        delete element.dataset.scheduled;
                    });
                }, 15000); // 15秒超时
                
                // 使用 Promise.allSettled 并行加载，提高容错性
                Promise.allSettled(
                    validBatch.map(({ element, data }) => 
                        loadImageWithPlaceholder(element, data).catch(err => {
                            console.warn('Individual image load failed:', err);
                        })
                    )
                ).finally(() => {
                    clearTimeout(batchTimeout);
                });
            }
            
            async function loadImageWithPlaceholder(imgElement, imgData) {
                //  防止重复加载
                if (imgElement.classList.contains('loaded') || imgElement.classList.contains('error')) return;
                
                const fileSize = imgData.size || 0;
                const isLargeImage = fileSize >= CONFIG.THUMBNAIL_SIZE_THRESHOLD;
                
                try {
                    let imageUrl = imgData.url;
                    
                    //  检查 Object URL 是否仍然有效
                    if (!imageUrl || !imageUrl.startsWith('blob:')) {
                        console.warn('Invalid Object URL:', imgData.name);
                        showErrorState(imgElement);
                        delete imgElement.dataset.scheduled;
                        return;
                    }
                    
                    if (isLargeImage) {
                        // 尝试使用缩略图
                        let thumbnailUrl = thumbnailCache.get(imgData.url);
                        if (!thumbnailUrl) {
                            try {
                                thumbnailUrl = await enqueueThumbnailGeneration(imgData.url);
                            } catch (thumbErr) {
                                // 🔄 降级策略：缩略图生成失败时使用原图
                                console.warn('Thumbnail generation failed, using original:', thumbErr);
                                thumbnailUrl = null;
                            }
                        }
                        
                        // 如果有缩略图则使用，否则使用原图
                        imageUrl = thumbnailUrl || imgData.url;
                    }
                    
                    // 设置图片源并监听加载事件
                    await new Promise((resolve, reject) => {
                        const timeout = setTimeout(() => {
                            reject(new Error('Load timeout'));
                        }, 10000); // 10秒超时
                        
                        imgElement.onload = () => {
                            clearTimeout(timeout);
                            resolve();
                        };
                        
                        imgElement.onerror = () => {
                            clearTimeout(timeout);
                            reject(new Error('Image load failed'));
                        };
                        
                        imgElement.src = imageUrl;
                    });
                    
                    // 加载成功
                    imgElement.classList.add('loaded');
                    delete imgElement.dataset.scheduled;
                    const placeholder = imgElement.parentElement.querySelector('.img-loading-placeholder');
                    if (placeholder) placeholder.remove();
                    
                } catch (err) {
                    console.error('Failed to load image:', imgData.name, err);
                    
                    // 🔄 清除 scheduled 标记，允许重试
                    delete imgElement.dataset.scheduled;
                    
                    // 显示错误状态
                    showErrorState(imgElement);
                }
            }
            
            // 显示错误状态（保留占位符显示错误信息）
            function showErrorState(imgElement) {
                imgElement.classList.add('error');
                const placeholder = imgElement.parentElement.querySelector('.img-loading-placeholder');
                if (placeholder) {
                    placeholder.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#999;font-size:0.8rem;">⚠️ 加载失败</div>';
                    placeholder.classList.add('error');
                }
            }
            function onScroll() {
                // 标记为滚动状态
                isScrolling = true;
                
                // 清除之前的恢复定时器
                if (scrollPauseTimer) {
                    clearTimeout(scrollPauseTimer);
                }
                
                // 设置滚动停止后的恢复定时器
                scrollPauseTimer = setTimeout(() => {
                    isScrolling = false;
                    // 滚动停止后恢复加载
                    observeVisibleImages();
                    if (thumbnailQueue.length > 0) {
                        processThumbnailQueue();
                    }
                }, CONFIG.SCROLL_STOP_DELAY);
                
                // 原有的虚拟滚动逻辑
                if (!ticking) {
                    requestAnimationFrame(() => {
                        renderVisibleItems();
                        // 注意：这里不调用 observeVisibleImages，由滚动停止后触发
                        ticking = false;
                    });
                    ticking = true;
                }
            }

            function updateDisplay() {
                let filtered = [...allImages];
                if (activeFolder !== null) {
                    filtered = filtered.filter(img => imageBelongsToFolder(img, activeFolder));
                }
                const q = searchInput.value.trim().toLowerCase();
                if (q) {
                    filtered = filtered.filter(img => img.name.toLowerCase().includes(q));
                }
                // 日期筛选
                const startVal = filterDateStart.value;
                const endVal = filterDateEnd.value;
                if (startVal || endVal) {
                    const start = startVal ? new Date(startVal + 'T00:00:00').getTime() : null;
                    const end = endVal ? new Date(endVal + 'T23:59:59.999').getTime() : null;
                    filtered = filtered.filter(img => {
                        const time = img.modified || 0;
                        if (start && time < start) return false;
                        if (end && time > end) return false;
                        return true;
                    });
                }
                // 排序
                const [sortKey, sortOrder] = currentSort.split('-');
                filtered.sort((a, b) => {
                    let valA, valB;
                    if (sortKey === 'name') {
                        valA = a.name.toLowerCase();
                        valB = b.name.toLowerCase();
                    } else if (sortKey === 'date') {
                        valA = a.modified || 0;
                        valB = b.modified || 0;
                    } else if (sortKey === 'size') {
                        valA = a.size || 0;
                        valB = b.size || 0;
                    }
                    if (valA < valB) return sortOrder === 'asc' ? -1 : 1;
                    if (valA > valB) return sortOrder === 'asc' ? 1 : -1;
                    return 0;
                });

                currentDisplayImages = filtered;
                statImages.textContent = filtered.length;
                
                // 优化统计计算：避免重复创建 Set，使用更高效的计算方式
                const folderSet = new Set();
                let totalSize = 0;
                for (let i = 0; i < filtered.length; i++) {
                    const img = filtered[i];
                    folderSet.add(normalizePath(img.folder || '根目录'));
                    totalSize += img.size || 0;
                }
                statFolders.textContent = folderSet.size;
                statSize.textContent = formatSize(totalSize);
                
                //  更新当前文件夹徽章显示 - 空字符串表示根目录（用户选择的文件夹）
                if (activeFolder === null) {
                    currentFolderBadge.style.display = 'none';
                } else {
                    currentFolderBadge.style.display = 'inline-block';
                    // activeFolder 为空字符串时，显示根文件夹名称；否则显示子文件夹路径
                    const displayName = activeFolder === '' ? (currentRootFolder || '根目录') : activeFolder;
                    currentFolderBadge.textContent = `📂 ${displayName}`;
                }
                
                document.querySelectorAll('.tree-item').forEach(el => el.classList.remove('active'));
                
                //  查找并高亮激活的树节点
                // 根目录对应 data-path="__root__"（在 renderTree 中设置）
                let selector;
                if (activeFolder === '') {
                    // 空字符串表示根目录，对应 __root__
                    selector = '.tree-item[data-path="__root__"]';
                } else if (activeFolder === null) {
                    // null 表示未选择，不选中任何节点
                    selector = null;
                } else {
                    // 其他具体路径
                    const escapedPath = typeof CSS !== 'undefined' && CSS.escape ? CSS.escape(activeFolder) : activeFolder.replace(/"/g, '\\"');
                    selector = `.tree-item[data-path="${escapedPath}"]`;
                }
                
                if (selector) {
                    const activeEl = document.querySelector(selector);
                    if (activeEl) activeEl.classList.add('active');
                }
                
                updateLayoutParams();
                renderedStartIndex = -1;
                renderedEndIndex = -1;
                renderVisibleItems();
                observeVisibleImages();
            }

            // ---------- 灯箱与缩放 ----------
            let currentLightboxList = [];
            let currentIndex = -1;

            function openLightbox(idx, list){
                if(!list.length) return;
                currentLightboxList = list;
                currentIndex = idx;
                const img = list[idx];
                lightboxImg.src = img.url;
                lightbox.style.display = 'flex';
                lightboxPrev.style.display = list.length>1?'flex':'none';
                lightboxNext.style.display = list.length>1?'flex':'none';
                resetZoom();
            }

            function closeLightbox(){ 
                lightbox.style.display='none'; 
                lightboxImg.src=''; 
                resetZoom();
                // 清理状态，防止内存泄漏
                currentLightboxList = [];
                currentIndex = -1;
            }

            function navLightbox(dir){
                if(!currentLightboxList.length) return;
                let idx = currentIndex + dir;
                if(idx<0) idx = currentLightboxList.length-1;
                if(idx>=currentLightboxList.length) idx=0;
                openLightbox(idx, currentLightboxList);
            }

            function resetZoom() {
                currentScale = 1;
                panX = 0;
                panY = 0;
                updateTransform();
            }

            function zoomIn() {
                currentScale = Math.min(currentScale + 0.25, 5);
                updateTransform();
            }

            function zoomOut() {
                currentScale = Math.max(currentScale - 0.25, 0.25);
                // 缩小到一定程度时重置平移
                if (currentScale <= 1) {
                    panX = 0;
                    panY = 0;
                }
                updateTransform();
            }
            
            // 更新变换（缩放+平移）
            function updateTransform() {
                lightboxImgWrapper.style.transform = `translate(${panX}px, ${panY}px) scale(${currentScale})`;
            }
            
            // 开始平移
            function startPan(e) {
                if (currentScale <= 1) return; // 只有在放大时才允许平移
                isPanning = true;
                startX = e.clientX || e.touches[0].clientX;
                startY = e.clientY || e.touches[0].clientY;
                lightboxImgWrapper.style.cursor = 'grabbing';
                e.preventDefault();
            }
            
            // 平移中
            function doPan(e) {
                if (!isPanning) return;
                const clientX = e.clientX || e.touches[0].clientX;
                const clientY = e.clientY || e.touches[0].clientY;
                const deltaX = clientX - startX;
                const deltaY = clientY - startY;
                
                panX += deltaX;
                panY += deltaY;
                
                //  边界限制：防止图片移出视野
                const wrapperRect = lightboxImgWrapper.parentElement.getBoundingClientRect();
                const imgRect = lightboxImg.getBoundingClientRect();
                const maxPanX = Math.max(0, (imgRect.width * currentScale - wrapperRect.width) / 2);
                const maxPanY = Math.max(0, (imgRect.height * currentScale - wrapperRect.height) / 2);
                panX = Math.max(-maxPanX, Math.min(maxPanX, panX));
                panY = Math.max(-maxPanY, Math.min(maxPanY, panY));
                
                startX = clientX;
                startY = clientY;
                updateTransform();
                e.preventDefault();
            }
            
            // 结束平移
            function endPan() {
                isPanning = false;
                lightboxImgWrapper.style.cursor = currentScale > 1 ? 'grab' : 'default';
            }
            
            // 移动端双指缩放手势
            let initialDistance = 0;
            let initialScale = 1;
            
            function getTouchDistance(touch1, touch2) {
                const dx = touch1.clientX - touch2.clientX;
                const dy = touch1.clientY - touch2.clientY;
                return Math.sqrt(dx * dx + dy * dy);
            }
            
            // 统一的触摸事件处理（合并平移、缩放、滑动切换）
            lightboxImgWrapper.addEventListener('touchstart', (e) => {
                if (e.touches.length === 2) {
                    // 双指缩放开始
                    e.preventDefault();
                    initialDistance = getTouchDistance(e.touches[0], e.touches[1]);
                    initialScale = currentScale;
                } else if (e.touches.length === 1) {
                    if (currentScale > 1) {
                        // 放大状态：启动平移
                        startPan(e);
                    } else {
                        // 未放大：记录起始位置用于滑动切换
                        startX = e.touches[0].clientX;
                    }
                }
            }, { passive: false });
            
            lightboxImgWrapper.addEventListener('touchmove', (e) => {
                if (e.touches.length === 2) {
                    // 双指缩放中
                    e.preventDefault();
                    const currentDistance = getTouchDistance(e.touches[0], e.touches[1]);
                    //  防止除零错误：初始距离过小时忽略
                    if (initialDistance < 10) return;
                    const scale = initialScale * (currentDistance / initialDistance);
                    currentScale = Math.max(0.25, Math.min(scale, 5));
                    updateTransform();
                } else if (e.touches.length === 1 && currentScale > 1) {
                    // 放大状态：执行平移
                    doPan(e);
                } else if (e.touches.length === 1 && currentScale <= 1 && !isPanning) {
                    // 单指滑动检测（用于切换图片）
                    const deltaX = e.touches[0].clientX - startX;
                    if (Math.abs(deltaX) > 50) {
                        // 滑动距离超过50px，触发切换
                        if (deltaX > 0) {
                            navLightbox(-1); // 向右滑，上一张
                        } else {
                            navLightbox(1); // 向左滑，下一张
                        }
                        startX = e.touches[0].clientX;
                    }
                }
            }, { passive: false });
            
            lightboxImgWrapper.addEventListener('touchend', (e) => {
                if (currentScale > 1) {
                    // 放大状态：结束平移
                    endPan();
                }
            });

            // 全屏切换
            function toggleFullscreen() {
                // 检测全屏 API 支持
                if (!document.fullscreenEnabled) {
                    showToast('❌ 浏览器不支持全屏功能');
                    return;
                }
                
                if (!document.fullscreenElement) {
                    lightbox.requestFullscreen().catch(err => {
                        showToast('全屏失败：' + err.message);
                    });
                } else {
                    document.exitFullscreen();
                }
            }

            // 复制当前图片到剪贴板
            async function copyImageToClipboard() {
                if (currentLightboxList.length === 0) return;
                const img = currentLightboxList[currentIndex];
                try {
                    const response = await fetch(img.url);
                    const blob = await response.blob();
                    await navigator.clipboard.write([
                        new ClipboardItem({ [blob.type]: blob })
                    ]);
                    showToast('✅ 图片已复制到剪贴板');
                } catch (err) {
                    showToast('❌ 复制失败：' + err.message);
                }
            }

            // 检测复制功能支持，不支持则隐藏按钮
            if (!navigator.clipboard || !window.ClipboardItem) {
                lightboxCopy.style.display = 'none';
            }

            // 事件绑定
            lightboxClose.addEventListener('click', closeLightbox);
            lightboxPrev.addEventListener('click', (e)=>{e.stopPropagation(); navLightbox(-1);});
            lightboxNext.addEventListener('click', (e)=>{e.stopPropagation(); navLightbox(1);});
            lightbox.addEventListener('click', function(e){ if(e.target===lightbox) closeLightbox(); });
            
            lightboxZoomIn.addEventListener('click', (e)=>{e.stopPropagation(); zoomIn();});
            lightboxZoomOut.addEventListener('click', (e)=>{e.stopPropagation(); zoomOut();});
            lightboxReset.addEventListener('click', (e)=>{e.stopPropagation(); resetZoom();});
            lightboxFullscreen.addEventListener('click', (e)=>{e.stopPropagation(); toggleFullscreen();});
            lightboxCopy.addEventListener('click', (e)=>{e.stopPropagation(); copyImageToClipboard();});

            lightboxImgWrapper.addEventListener('wheel', (e) => {
                e.preventDefault();
                if (e.deltaY < 0) zoomIn();
                else zoomOut();
            }, { passive: false });
            
            // 添加平移事件监听（鼠标）
            lightboxImgWrapper.addEventListener('mousedown', startPan);
            document.addEventListener('mousemove', doPan);
            document.addEventListener('mouseup', endPan);
            
            // 设置初始光标样式
            lightboxImgWrapper.style.cursor = 'default';
            lightboxImgWrapper.style.transition = 'transform 0.1s ease-out';
            
            document.addEventListener('keydown', e=>{
                if(lightbox.style.display==='flex'){
                    if(e.key==='Escape') {
                        if (document.fullscreenElement) {
                            document.exitFullscreen();
                        } else {
                            closeLightbox();
                        }
                    }
                    if(e.key==='ArrowLeft') { e.preventDefault(); navLightbox(-1); }
                    if(e.key==='ArrowRight') { e.preventDefault(); navLightbox(1); }
                    if(e.key==='+' || e.key==='=') { e.preventDefault(); zoomIn(); }
                    if(e.key==='-') { e.preventDefault(); zoomOut(); }
                    if(e.key==='0') { e.preventDefault(); resetZoom(); }
                    if(e.key==='f' || e.key==='F') { e.preventDefault(); toggleFullscreen(); }
                }
            });

            // 全屏变化时更新按钮文字（可选）
            document.addEventListener('fullscreenchange', () => {
                if (document.fullscreenElement) {
                    lightboxFullscreen.textContent = '⛶ 退出全屏';
                } else {
                    lightboxFullscreen.textContent = '⛶ 全屏';
                }
            });

            // 排序与筛选
            sortSelect.addEventListener('change', () => {
                currentSort = sortSelect.value;
                updateDisplay();
            });

            applyFilterBtn.addEventListener('click', () => {
                updateDisplay();
            });

            clearFilterBtn.addEventListener('click', () => {
                filterDateStart.value = '';
                filterDateEnd.value = '';
                updateDisplay();
            });

            searchInput.addEventListener('input', () => {
                // 搜索防抖：300ms 延迟执行
                clearTimeout(searchDebounceTimer);
                searchDebounceTimer = setTimeout(() => {
                    scrollContainer.scrollTop = 0;
                    updateDisplay();
                }, 300);
            });

            async function handleSelectFolder() {
                try {
                    const dirHandle = await window.showDirectoryPicker();
                    
                    // 显示加载状态
                    showLoading('正在扫描文件夹...', '已发现 0 张图片');
                    
                    // 先清理所有旧资源
                    cleanupAllResources();
                    
                    const images = [];
                    let scannedCount = 0;
                    
                    async function scanDirHandle(handle, pathPrefix = '') {
                        const rawPath = pathPrefix ? pathPrefix + '/' + handle.name : handle.name;
                        const currentPath = normalizePath(rawPath);
                        for await (const entry of handle.values()) {
                            if (entry.kind === 'file') {
                                const ext = entry.name.split('.').pop().toLowerCase();
                                if (imageExtensions.has(ext)) {
                                    const file = await entry.getFile();
                                    const url = URL.createObjectURL(file);
                                    // 将创建的 URL 加入跟踪集合
                                    objectUrlSet.add(url);
                                    images.push({
                                        url: url,
                                        name: entry.name,
                                        folder: currentPath,
                                        size: file.size,
                                        modified: file.lastModified
                                    });
                                    scannedCount++;
                                    
                                    // 每扫描100个文件更新一次进度（避免频繁DOM操作）
                                    if (scannedCount % 100 === 0) {
                                        loadingProgress.textContent = `已发现 ${scannedCount} 张图片`;
                                        // 让出主线程，避免界面冻结
                                        await new Promise(resolve => setTimeout(resolve, 0));
                                    }
                                }
                            } else if (entry.kind === 'directory') {
                                await scanDirHandle(entry, currentPath);
                            }
                        }
                    }
                    await scanDirHandle(dirHandle);
                    
                    // 隐藏加载状态
                    hideLoading();
                    
                    //  保存根文件夹名称
                    currentRootFolder = dirHandle.name;
                    
                    // 不再需要手动清理，cleanupObjectUrls 已处理
                    allImages = images;
                    folderTree = buildFolderTree(allImages, currentRootFolder);
                    activeFolder = ''; //  默认选中根目录（空字符串）
                    searchInput.value = '';
                    renderTree();
                    scrollContainer.scrollTop = 0;
                    updateDisplay();
                    showToast(`✅ 已加载 ${allImages.length} 张图片`);
                } catch (err) {
                    // 确保出错时也隐藏加载状态
                    hideLoading();
                    if (err.name !== 'AbortError') {
                        showToast('❌ 无法读取文件夹：' + err.message);
                    }
                }
            }
            selectFolderBtn.addEventListener('click', handleSelectFolder);

            scrollContainer.addEventListener('scroll', onScroll, { passive: true });
            
            // 优先使用 ResizeObserver，resize 事件作为降级方案并添加防抖
            let resizeDebounceTimer = null;
            const handleResize = () => {
                clearTimeout(resizeDebounceTimer);
                resizeDebounceTimer = setTimeout(() => {
                    updateLayoutParams();
                    renderedStartIndex = -1;
                    renderedEndIndex = -1;
                    renderVisibleItems();
                    observeVisibleImages();
                }, 150);
            };
            
            if (window.ResizeObserver) {
                resizeObserver = new ResizeObserver(handleResize);
                resizeObserver.observe(scrollContainer);
            } else {
                // 降级方案：使用 resize 事件
                window.addEventListener('resize', handleResize);
            }

            initLazyObserver();
            folderTree = null;
            renderTree();
            updateDisplay();
            
            //  保存清理函数引用，用于页面卸载时移除 resize 监听器
            const cleanupResizeListener = () => {
                if (!window.ResizeObserver) {
                    window.removeEventListener('resize', handleResize);
                }
            };
            
            // 页面卸载时清理所有资源，防止内存泄漏
            window.addEventListener('beforeunload', () => {
                cleanupResizeListener();
                cleanupAllResources();
            });
        })();
    </script>
</body>
